# https://taskfile.dev

version: "3"

dotenv: [".env"]

includes:
  # CUSTOM
  lore:
    taskfile: ./Taskfile.lore.yml
    dir: ./
  # END CUSTOM

tasks:
  build:
    desc: alias → lore:build
    cmds:
      - task: lore:build

  check:
    desc: alias → lore:check — the full gate; run before every push
    cmds:
      - task: lore:check

  check:fast:
    desc: alias → lore:check:fast — the fast tier for landing a small fix (docs/DEVELOPMENT.md "Landing")
    cmds:
      - task: lore:check:fast

  check:after-land:
    desc: alias → lore:check:after-land — the full gate on the landed origin/main
    cmds:
      - task: lore:check:after-land

  upgrade:
    desc: update every Go dependency of the root module
    cmds:
      - go get -u ./...
      - go mod tidy

  lint:
    desc: gofmt + go vet on the root module
    cmds:
      - gofmt -w $(find . -name '*.go' -not -path './vendor/*' -not -path '*/gen/*' -not -path './.git/*')
      - go vet ./...
