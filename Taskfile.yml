# https://taskfile.dev

version: "3"

dotenv: [".env"]

includes:
  # CUSTOM
  lore:
    taskfile: ./Taskfile.lore.yml
    dir: ./
  # END CUSTOM

tasks:
  build:
    desc: alias → lore:build
    cmds:
      - task: lore:build

  check:
    desc: alias → lore:check — the full gate; run before every push
    cmds:
      - task: lore:check

  check:fast:
    desc: alias → lore:check:fast — the fast tier for landing a small fix (docs/DEVELOPMENT.md "Landing")
    cmds:
      - task: lore:check:fast

  check:after-land:
    desc: alias → lore:check:after-land — the full gate on the landed origin/main
    cmds:
      - task: lore:check:after-land

  bench:recall:
    desc: alias → lore:bench:recall — the recall gate "lore beats grep" (report tmp/bench/recall.md)
    cmds:
      - task: lore:bench:recall

  bench:agent:
    desc: alias → lore:bench:agent — the blind agent runs (lore agent vs grep agent on the recall questions, lore agent vs plain agent on the coding traps; starts real agents; sections in tmp/bench/recall.md and tmp/bench/coding.md)
    cmds:
      - task: lore:bench:agent

  bench:coding:
    desc: alias → lore:bench:coding — the coding-agent context gate (report tmp/bench/coding.md)
    cmds:
      - task: lore:bench:coding

  upgrade:
    desc: update every Go dependency of the root module
    cmds:
      - go get -u ./...
      - go mod tidy

  lint:
    desc: gofmt + go vet on the root module
    cmds:
      - gofmt -w $(find . -name '*.go' -not -path './vendor/*' -not -path '*/gen/*' -not -path './.git/*')
      - go vet ./...
