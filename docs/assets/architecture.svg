<svg viewBox="0 0 939 745" width="939" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- White canvas so the figure reads on light and dark pages. -->
  <rect x="0" y="0" width="939" height="745" fill="#ffffff"/>
  <text x="469.5" y="34" font-size="16" fill="#1e293b" text-anchor="middle">How lore is built: a note goes down into git, and comes back up as context</text>
  <rect x="22" y="58" width="650" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="347" y="74" font-size="11" fill="#64748b" text-anchor="middle">Layer 1 · People and agents</text>
  <rect x="22" y="183" width="650" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="347" y="199" font-size="11" fill="#64748b" text-anchor="middle">Layer 2 · Commands you run</text>
  <rect x="22" y="308" width="650" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="347" y="324" font-size="11" fill="#64748b" text-anchor="middle">Layer 3 · Decisions: who sees it, and when</text>
  <rect x="22" y="433" width="650" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="347" y="449" font-size="11" fill="#64748b" text-anchor="middle">Layer 4 · Team sync</text>
  <rect x="22" y="558" width="650" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="347" y="574" font-size="11" fill="#64748b" text-anchor="middle">Layer 5 · Where it is kept</text>
  <rect x="697" y="58" width="220" height="598" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="707" y="74" font-size="11" fill="#64748b">Helpers around git</text>
  <path d="M132,145 L 132,200" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M562,206 L 562,151" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M132,270 L 132,325" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M562,331 L 562,276" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M132,395 L 132,450" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M562,456 L 562,401" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M132,520 L 132,575" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M562,581 L 562,526" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="37" y="86" width="190" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="108" font-size="12" fill="#1e40af" text-anchor="middle">1 · An agent saves a note</text>
  <text x="132" y="126" font-size="10" fill="#64748b" text-anchor="middle">agent-backend runs lore task add</text>
  <rect x="252" y="86" width="190" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="347" y="108" font-size="12" fill="#1e293b" text-anchor="middle">You at the terminal</text>
  <text x="347" y="126" font-size="10" fill="#64748b" text-anchor="middle">lore commands · lore tui screen</text>
  <rect x="467" y="86" width="190" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="562" y="108" font-size="12" fill="#166534" text-anchor="middle">E · Context for agents</text>
  <text x="562" y="126" font-size="10" fill="#64748b" text-anchor="middle">CLAUDE.md · AGENTS.md</text>
  <rect x="712" y="86" width="190" height="89.2" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="807" y="117.9" font-size="12" fill="#6b21a8" text-anchor="middle">CI job on pull requests</text>
  <text x="807" y="135.9" font-size="10" fill="#64748b" text-anchor="middle">lore sync ci-merge fixes</text>
  <text x="807" y="150.9" font-size="10" fill="#64748b" text-anchor="middle">conflicts in lore rows only</text>
  <rect x="37" y="211" width="190" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="233" font-size="12" fill="#1e40af" text-anchor="middle">2 · Add a row</text>
  <text x="132" y="251" font-size="10" fill="#64748b" text-anchor="middle">task, memory, rule, decision add</text>
  <rect x="252" y="211" width="190" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="347" y="233" font-size="12" fill="#1e293b" text-anchor="middle">Share and sync</text>
  <text x="347" y="251" font-size="10" fill="#64748b" text-anchor="middle">lore sync · land · share</text>
  <rect x="467" y="211" width="190" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="562" y="233" font-size="12" fill="#166534" text-anchor="middle">D · Write the context file</text>
  <text x="562" y="251" font-size="10" fill="#64748b" text-anchor="middle">lore render</text>
  <rect x="712" y="202.2" width="190" height="89.2" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="807" y="234.1" font-size="12" fill="#6b21a8" text-anchor="middle">Health check</text>
  <text x="807" y="252.1" font-size="10" fill="#64748b" text-anchor="middle">lore doctor · lore store doctor</text>
  <text x="807" y="267.1" font-size="10" fill="#64748b" text-anchor="middle">says what is broken and why</text>
  <rect x="37" y="336" width="190" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="358" font-size="12" fill="#1e40af" text-anchor="middle">3 · Pick who and when</text>
  <text x="132" y="376" font-size="10" fill="#64748b" text-anchor="middle">--to: who sees · --live: now</text>
  <rect x="252" y="336" width="190" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="347" y="358" font-size="12" fill="#1e293b" text-anchor="middle">Who you are</text>
  <text x="347" y="376" font-size="10" fill="#64748b" text-anchor="middle">your identity and your org</text>
  <rect x="467" y="336" width="190" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="562" y="358" font-size="12" fill="#166534" text-anchor="middle">C · What may show here</text>
  <text x="562" y="376" font-size="10" fill="#64748b" text-anchor="middle">safe sources only (leak guard)</text>
  <rect x="712" y="318.4" width="190" height="89.2" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="807" y="350.4" font-size="12" fill="#6b21a8" text-anchor="middle">Commit check (git hook)</text>
  <text x="807" y="368.4" font-size="10" fill="#64748b" text-anchor="middle">stops secrets and internal notes</text>
  <text x="807" y="383.4" font-size="10" fill="#64748b" text-anchor="middle">from reaching the client repo</text>
  <rect x="37" y="461" width="190" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="483" font-size="12" fill="#1e40af" text-anchor="middle">4 · Save for the team now</text>
  <text x="132" y="501" font-size="10" fill="#64748b" text-anchor="middle">live list: commit, then push</text>
  <rect x="252" y="461" width="190" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="347" y="483" font-size="12" fill="#1e293b" text-anchor="middle">Private notes and claims</text>
  <text x="347" y="501" font-size="10" fill="#64748b" text-anchor="middle">store repos · claims on tasks</text>
  <rect x="467" y="461" width="190" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="562" y="483" font-size="12" fill="#166534" text-anchor="middle">B · Merge teammates' edits</text>
  <text x="562" y="501" font-size="10" fill="#64748b" text-anchor="middle">field by field, then load</text>
  <rect x="712" y="434.6" width="190" height="89.2" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="807" y="466.6" font-size="12" fill="#6b21a8" text-anchor="middle">Merge helper (git driver)</text>
  <text x="807" y="484.6" font-size="10" fill="#64748b" text-anchor="middle">merges two edits of a row</text>
  <text x="807" y="499.6" font-size="10" fill="#64748b" text-anchor="middle">field by field, not line by line</text>
  <rect x="37" y="586" width="190" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="608" font-size="12" fill="#1e40af" text-anchor="middle">5 · Hidden lists in git</text>
  <text x="132" y="626" font-size="10" fill="#64748b" text-anchor="middle">refs, not branches · .lore/data</text>
  <rect x="252" y="586" width="190" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="347" y="608" font-size="12" fill="#1e293b" text-anchor="middle">Local cache (SQLite)</text>
  <text x="347" y="626" font-size="10" fill="#64748b" text-anchor="middle">.lore/lore.db, fast to search</text>
  <rect x="467" y="586" width="190" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="562" y="608" font-size="12" fill="#166534" text-anchor="middle">A · Fetch teammates' lists</text>
  <text x="562" y="626" font-size="10" fill="#64748b" text-anchor="middle">copied in from the git remote</text>
  <rect x="712" y="550.8" width="190" height="89.2" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="807" y="582.8" font-size="12" fill="#6b21a8" text-anchor="middle">Other git hooks</text>
  <text x="807" y="600.8" font-size="10" fill="#64748b" text-anchor="middle">refresh after a branch switch;</text>
  <text x="807" y="615.8" font-size="10" fill="#64748b" text-anchor="middle">carry finished rows on push</text>
  <path d="M22,695 L 52,695" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="72" y="699" font-size="11" fill="#1e293b">Steps 1–5: you or your agent save a row; it goes down into git and out to the team.</text>
  <path d="M22,717 L 52,717" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="72" y="721" font-size="11" fill="#1e293b">Steps A–E: your teammates' rows come back up as the file your agents read.</text>
</svg>
