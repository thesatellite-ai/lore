<svg viewBox="0 0 959 1006" width="959" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- Solid white canvas so the figure reads on both light and dark pages. -->
  <rect x="0" y="0" width="959" height="1006" fill="#ffffff"/>
  <text x="479.5" y="34" font-size="16" fill="#1e293b" text-anchor="middle">How lore is built: a command goes down into git, teammates' rows come back up</text>
  <!-- 1. Layer groups: x=22..702, 98 tall, 125px pitch; the side group spans every row. -->
  <rect x="22" y="76" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="92" font-size="11" fill="#64748b" text-anchor="middle">Callers · who uses lore</text>
  <rect x="22" y="201" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="217" font-size="11" fill="#64748b" text-anchor="middle">surface/ · how a call comes in</text>
  <rect x="22" y="326" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="342" font-size="11" fill="#64748b" text-anchor="middle">wire/ · cmd/lore · composition root</text>
  <rect x="22" y="451" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="467" font-size="11" fill="#64748b" text-anchor="middle">ops/&lt;noun&gt;/ · operation registry</text>
  <rect x="22" y="576" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="592" font-size="11" fill="#64748b" text-anchor="middle">engine/ · the one read/write path</text>
  <rect x="22" y="701" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="717" font-size="11" fill="#64748b" text-anchor="middle">store/ · adapters/ · port and backends</text>
  <rect x="22" y="826" width="680" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="362.0" y="842" font-size="11" fill="#64748b" text-anchor="middle">Storage · git, shared with teammates</text>
  <text x="832.0" y="66" font-size="11" fill="#64748b" text-anchor="middle">Plugins and helpers, one per layer</text>
  <!-- 2. Flows: blue 1-7 down the left column, green A-G up the right column (5px / 11px clearances). -->
  <path d="M137.0,163 L 137.0,218" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M587.0,224 L 587.0,169" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M137.0,288 L 137.0,343" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M587.0,349 L 587.0,294" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M137.0,413 L 137.0,468" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M587.0,474 L 587.0,419" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M137.0,538 L 137.0,593" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M587.0,599 L 587.0,544" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M137.0,663 L 137.0,718" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M587.0,724 L 587.0,669" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M137.0,788 L 137.0,843" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M587.0,849 L 587.0,794" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- 3. Boxes: step (blue), what lives in the layer (white), return step (green), helper (purple). -->
  <rect x="37" y="104" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="126" font-size="12" fill="#1e40af" text-anchor="middle">1 · Run a command</text>
  <text x="137.0" y="144" font-size="10" fill="#64748b" text-anchor="middle">lore task add --title "Ship v2"</text>
  <rect x="262" y="104" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="126" font-size="12" fill="#1e293b" text-anchor="middle">People and coding agents</text>
  <text x="362.0" y="144" font-size="10" fill="#64748b" text-anchor="middle">terminal · lore tui · REST</text>
  <rect x="487" y="104" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="126" font-size="12" fill="#166534" text-anchor="middle">G · Agents read context</text>
  <text x="587.0" y="144" font-size="10" fill="#64748b" text-anchor="middle">pointer file → .lore/LORE.md</text>
  <rect x="727" y="76" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="112" font-size="12" fill="#6b21a8" text-anchor="middle">Session hook</text>
  <text x="832.0" y="130" font-size="10" fill="#64748b" text-anchor="middle">lore agent start --tool</text>
  <text x="832.0" y="146" font-size="10" fill="#64748b" text-anchor="middle">records the agent's session</text>
  <rect x="37" y="229" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="251" font-size="12" fill="#1e40af" text-anchor="middle">2 · Parse the call</text>
  <text x="137.0" y="269" font-size="10" fill="#64748b" text-anchor="middle">cli flags or a REST body</text>
  <rect x="262" y="229" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="251" font-size="12" fill="#1e293b" text-anchor="middle">cli · rest · tui · docs</text>
  <text x="362.0" y="269" font-size="10" fill="#64748b" text-anchor="middle">rest is local: lore api</text>
  <rect x="487" y="229" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="251" font-size="12" fill="#166534" text-anchor="middle">F · lore sync re-renders</text>
  <text x="587.0" y="269" font-size="10" fill="#64748b" text-anchor="middle">or run lore render</text>
  <rect x="727" y="201" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="237" font-size="12" fill="#6b21a8" text-anchor="middle">Docs generator</text>
  <text x="832.0" y="255" font-size="10" fill="#64748b" text-anchor="middle">CLI reference, openapi.json</text>
  <text x="832.0" y="271" font-size="10" fill="#64748b" text-anchor="middle">lore spec docs · openapi</text>
  <rect x="37" y="354" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="376" font-size="12" fill="#1e40af" text-anchor="middle">3 · Resolve the store</text>
  <text x="137.0" y="394" font-size="10" fill="#64748b" text-anchor="middle">config, identity, repo</text>
  <rect x="262" y="354" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="376" font-size="12" fill="#1e293b" text-anchor="middle">Builds the lore binary</text>
  <text x="362.0" y="394" font-size="10" fill="#64748b" text-anchor="middle">picks adapters, wires ops</text>
  <rect x="487" y="354" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="376" font-size="12" fill="#166534" text-anchor="middle">E · Write LORE.md</text>
  <text x="587.0" y="394" font-size="10" fill="#64748b" text-anchor="middle">atomic, plus pointer blocks</text>
  <rect x="727" y="326" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="362" font-size="12" fill="#6b21a8" text-anchor="middle">Render targets</text>
  <text x="832.0" y="380" font-size="10" fill="#64748b" text-anchor="middle">LORE.md + a pointer per tool</text>
  <text x="832.0" y="396" font-size="10" fill="#64748b" text-anchor="middle">AGENTS.md and other tool files</text>
  <rect x="37" y="479" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="501" font-size="12" fill="#1e40af" text-anchor="middle">4 · Run the registry op</text>
  <text x="137.0" y="519" font-size="10" fill="#64748b" text-anchor="middle">one op per command</text>
  <rect x="262" y="479" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="501" font-size="12" fill="#1e293b" text-anchor="middle">One package per noun</text>
  <text x="362.0" y="519" font-size="10" fill="#64748b" text-anchor="middle">task · rule · memory · …</text>
  <rect x="487" y="479" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="501" font-size="12" fill="#166534" text-anchor="middle">D · Render op picks rows</text>
  <text x="587.0" y="519" font-size="10" fill="#64748b" text-anchor="middle">by scope, budget and target</text>
  <rect x="727" y="451" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="487" font-size="12" fill="#6b21a8" text-anchor="middle">Operation registry</text>
  <text x="832.0" y="505" font-size="10" fill="#64748b" text-anchor="middle">op.Define: CLI + REST routes</text>
  <text x="832.0" y="521" font-size="10" fill="#64748b" text-anchor="middle">built at startup</text>
  <rect x="37" y="604" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="626" font-size="12" fill="#1e40af" text-anchor="middle">5 · Validate and stamp</text>
  <text x="137.0" y="644" font-size="10" fill="#64748b" text-anchor="middle">refs, secret scan, HLC</text>
  <rect x="262" y="604" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="626" font-size="12" fill="#1e293b" text-anchor="middle">Nothing writes around it</text>
  <text x="362.0" y="644" font-size="10" fill="#64748b" text-anchor="middle">uses schema/, logic/, model/</text>
  <rect x="487" y="604" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="626" font-size="12" fill="#166534" text-anchor="middle">C · Read the rows</text>
  <text x="587.0" y="644" font-size="10" fill="#64748b" text-anchor="middle">queries hit the cache</text>
  <rect x="727" y="576" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="612" font-size="12" fill="#6b21a8" text-anchor="middle">Doctor</text>
  <text x="832.0" y="630" font-size="10" fill="#64748b" text-anchor="middle">what is broken, and the fix</text>
  <text x="832.0" y="646" font-size="10" fill="#64748b" text-anchor="middle">lore doctor</text>
  <rect x="37" y="729" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="751" font-size="12" fill="#1e40af" text-anchor="middle">6 · Write the row file</text>
  <text x="137.0" y="769" font-size="10" fill="#64748b" text-anchor="middle">Backend.Write, then cache</text>
  <rect x="262" y="729" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="751" font-size="12" fill="#1e293b" text-anchor="middle">Backend port + adapters</text>
  <text x="362.0" y="769" font-size="10" fill="#64748b" text-anchor="middle">git · folder · rowfs · SQLite</text>
  <rect x="487" y="729" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="751" font-size="12" fill="#166534" text-anchor="middle">B · Rebuild the cache</text>
  <text x="587.0" y="769" font-size="10" fill="#64748b" text-anchor="middle">SQLite from the row files</text>
  <rect x="727" y="701" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="737" font-size="12" fill="#6b21a8" text-anchor="middle">Merge driver</text>
  <text x="832.0" y="755" font-size="10" fill="#64748b" text-anchor="middle">merges rows field by field</text>
  <text x="832.0" y="771" font-size="10" fill="#64748b" text-anchor="middle">git merge driver, .lore/data</text>
  <rect x="37" y="854" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.0" y="876" font-size="12" fill="#1e40af" text-anchor="middle">7 · Commit and push</text>
  <text x="137.0" y="894" font-size="10" fill="#64748b" text-anchor="middle">to the git remote</text>
  <rect x="262" y="854" width="200" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="362.0" y="876" font-size="12" fill="#1e293b" text-anchor="middle">.lore/data row files</text>
  <text x="362.0" y="894" font-size="10" fill="#64748b" text-anchor="middle">in the repo or a notes store</text>
  <rect x="487" y="854" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="587.0" y="876" font-size="12" fill="#166534" text-anchor="middle">A · Pull teammates' rows</text>
  <text x="587.0" y="894" font-size="10" fill="#64748b" text-anchor="middle">git fetch from the remote</text>
  <rect x="727" y="826" width="210" height="98" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="832.0" y="862" font-size="12" fill="#6b21a8" text-anchor="middle">Commit hooks</text>
  <text x="832.0" y="880" font-size="10" fill="#64748b" text-anchor="middle">refuse broken rows, secrets</text>
  <text x="832.0" y="896" font-size="10" fill="#64748b" text-anchor="middle">pre-commit and commit-msg</text>
  <!-- 4. Legend, below the body. -->
  <path d="M22,952 L 52,952" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="72" y="956" font-size="11" fill="#1e293b">Steps 1–7: your command goes down through lore and its row is committed and pushed.</text>
  <path d="M22,978 L 52,978" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="72" y="982" font-size="11" fill="#1e293b">Steps A–G: teammates' rows come back up as the context file coding agents read.</text>
</svg>
