name: windows lock tests

# Runs the store lock tests (adapters/backend/rowfs, LockFileEx on Windows)
# on a real Windows runner, which no Linux or macOS build can execute. It runs only when the lock package or this file
# changes, or by hand. The repo is public, so Actions minutes are not billed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'adapters/backend/rowfs/**'
      - '.github/workflows/windows-lock.yml'

permissions:
  contents: read

jobs:
  processlock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Same toolchain line as ci.yml.
          go-version: "1.26.x"
          cache: false

      # -race needs cgo (the runner ships gcc).
      - name: go test -race (store lock)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./adapters/backend/rowfs/...
