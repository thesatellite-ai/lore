name: windows lock tests

# Runs the cross-process lock tests on a real Windows runner, including the
# Windows-only LockFileEx tests (flock_windows_test.go) that no Linux or
# macOS build can execute. It runs only when the lock package or this file
# changes, or by hand. The repo is public, so Actions minutes are not billed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'saas/pkg/aicoder/processlock/**'
      - '.github/workflows/windows-lock.yml'

permissions:
  contents: read

jobs:
  processlock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Same toolchain line as ci.yml.
          go-version: "1.26.x"
          cache: false

      # The lock package imports no other workspace module, so the saas
      # module builds on its own; GOWORK=off keeps the workspace's other
      # modules out of the build. -race needs cgo (the runner ships gcc).
      - name: go test -race (processlock)
        working-directory: saas
        env:
          GOWORK: "off"
          CGO_ENABLED: "1"
        run: go test -race ./pkg/aicoder/processlock/...
