name: Release tag

# This repository holds the open core and publishes no binaries. A release
# of the core is a version tag (vX.Y.Z), which is also the Go module
# version other builds require. The released lore binary is built by the
# build that composes the core with its setup page, which uploads the
# archives to this repository's GitHub Release for the same tag
# (docs/DEVELOPMENT.md "Releases").
#
# Two ways this fires:
#
#   1. push to main             → auto-bump patch and push the tag.
#                                 Put `[skip release]` in the commit
#                                 SUBJECT to opt out (most commits do).
#
#   2. workflow_dispatch, tag=X → create and push tag X on the current ref
#                                 (use for a minor or major bump).
#
# No binary is built here and no GitHub Release is created.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Empty = next patch.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Opt-out check looks ONLY at the commit subject line so the
      # marker described in this file's header can't self-trigger.
      - name: Evaluate skip marker
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="$(git log -1 --format=%s)"
          echo "subject: $subject"
          case "$subject" in
            *"[skip release]"*)
              echo "::notice::commit subject contains opt-out marker — no tag"
              echo "skip=true"  >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # tag: the input tag, else the next patch after the latest v* tag.
      - name: Resolve release tag
        id: v
        if: steps.skip.outputs.skip != 'true'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            next="$INPUT_TAG"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              base="${latest#v}"
              core="${base%%-*}"
              major="${core%%.*}"
              rest="${core#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          case "$next" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $next is not vX.Y.Z"; exit 1 ;;
          esac
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create + push tag
        if: steps.skip.outputs.skip != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "::notice::tagged $TAG; the binary release for it is built and uploaded separately"
