name: Release tag

# This repository holds the open core and publishes no binaries. A release
# of the core is a version tag (vX.Y.Z), which is also the Go module
# version other builds require. The released lore binary is built by the
# build that composes the core with its setup page, which uploads the
# archives to this repository's GitHub Release for the same tag
# (docs/DEVELOPMENT.md "Releases").
#
# It fires only by hand (workflow_dispatch), and only on RELEASE_BRANCH:
# releases are cut from `dev`, and `main` stays untouched until the
# maintainer squash-merges dev into it, so no push (to main or any other
# branch) ever tags. A run on another branch is refused.
#
#   tag empty → the next patch after the latest v* tag, on the dev commit.
#   tag=X     → tag X on the dev commit (use for a minor or major bump).
#
# No binary is built here and no GitHub Release is created.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Empty = next patch.'
        required: false
        type: string

permissions:
  contents: write

# The one branch a release may be cut from. Change it here only.
env:
  RELEASE_BRANCH: dev

# Two runs at once would both pick the same next patch tag.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Releases come from RELEASE_BRANCH only; a run on any other
      # ref (another branch, or a tag) is refused before anything is tagged.
      - name: Refuse a ref other than the release branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::releases are cut from $RELEASE_BRANCH only; this run is on $REF"
            exit 1
          fi

      # tag: the input tag, else the next patch after the latest v* tag.
      - name: Resolve release tag
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            next="$INPUT_TAG"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              base="${latest#v}"
              core="${base%%-*}"
              major="${core%%.*}"
              rest="${core#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          case "$next" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $next is not vX.Y.Z"; exit 1 ;;
          esac
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create + push tag
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "::notice::tagged $TAG on $RELEASE_BRANCH ($(git rev-parse --short HEAD)); the binary release for it is built and uploaded separately"
