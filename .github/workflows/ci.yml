name: CI

# Manual only: the local `task check` is the real gate. To run on every
# push, replace on: below with
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Highest go directive across the workspace modules.
          go-version: "1.26.x"
          cache: false

      - name: gofmt check
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path '*/gen/*'))
          if [ -n "$out" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build (pure Go, no CGO)
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/lore ./cmd/lore

      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...
