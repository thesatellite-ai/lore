# lore Taskfile (v0.1)
#
# To wire into the workspace's root Taskfile.yml, add this under `includes:` (in the CUSTOM section):
#
#   lore:
#     taskfile: ./Taskfile.lore.yml
#     dir: ./
#
# Then run tasks via `task lore:<name>`.
#
# Pre-flight before commit: `task lore:ship-check`
#
# Reference: BUILD_SYSTEM.md and .ai/TASKS.md

version: "3"

# Every go command of every task builds without the work tree's path and without VCS stamps
# (an OS-level GOFLAGS overrides it). Why: a package compiled without -trimpath records the
# folder it was built in, and -buildvcs records the commit and dirty state in cmd/lore, so ~30
# worktrees each compiled every package again and every commit added fresh cache entries; the
# shared Go build cache reached 1.2 TB and filled the disk. With these flags two worktrees at the
# same code share one cache entry. Test binaries carry the unstamped version "dev" (cmd/lore's
# default). Only `build` (and so install) stamps the real version and keeps the VCS stamp, as
# the release build does. check:gocache bounds what is left (docs/DEVELOPMENT.md).
env:
  GOFLAGS: "-trimpath -buildvcs=false"
  # Go runtime settings of every lore process the end-to-end suites start (the harnesses add
  # them to lore's environment: tests/e2eenv for teamharness, machines and setupe2e, envfor in
  # the docs runners). A lore command lives a fraction of a second, but Go sizes it for every
  # core: on the 48-core gate server about 40 % of each process's CPU went to 12 garbage-
  # collector workers and idle scheduler threads, and the gate was bound by CPU (measured
  # 2026-11-11 on the docs examples, ~1400 lore processes: 371 CPU-s with Go's defaults, 266
  # with GOMAXPROCS=8 GOGC=200, 260 with GOMAXPROCS=2 GOGC=400, 233 with GC off up to a 512 MiB
  # soft limit; each process peaks at 64 to 105 MB either way). Two procs also keep a process's
  # bursts small, so the load follows the cores each gate step declares. They change what a
  # run costs, never what lore does; the Go toolchain and the test binaries keep Go's defaults
  # (the linker needs ~700 MB, over that limit), and a person's lore is untouched. An
  # environment value of LORE_E2E_GOENV wins; set it empty for Go's defaults.
  LORE_E2E_GOENV: '{{env "LORE_E2E_GOENV" | default "GOMAXPROCS=2 GOGC=off GOMEMLIMIT=512MiB"}}'

vars:
  BIN_DIR: "{{.ROOT_DIR}}/tmp/bin"
  LORE_BIN: "{{.BIN_DIR}}/lore"
  WORKSPACE_ROOT: "{{.ROOT_DIR}}"
  TESTS_DIR: "{{.ROOT_DIR}}/tests"
  # File inside .git where `task check` records the tree it passed for; the
  # pre-push hook (.githooks/pre-push) reads the same name.
  CHECK_STAMP: "lore-check-passed"
  # File inside .git where `task check:fast` records the tree it passed for. The pre-push hook
  # accepts either stamp (the landing rule, docs/DEVELOPMENT.md "Landing").
  CHECK_FAST_STAMP: "lore-check-fast-passed"
  # File inside .git holding the tree when `task check` started: the stamp is
  # refused if any gate step (or a concurrent edit) changed tracked files.
  CHECK_BEGIN: "lore-check-begin"
  # Prints the tree id of the tracked files as they are in the work tree.
  TRACKED_TREE: "{{.TASKFILE_DIR}}/.githooks/lib/tracked-tree.sh"
  # Extra compiler flags for every -race run. -race also turns on checkptr for every package;
  # modernc.org's SQLite is C transpiled to Go by ccgo (generated, not hand-written) and does
  # pointer arithmetic on every statement, so checkptr alone made each cache open about 3x slower
  # (an ops test harness: 16.5 s -> 5.2 s). It is off for modernc.org/... only: the race detector
  # still instruments every package and checkptr stays on for lore's own code.
  RACE_GCFLAGS: "modernc.org/...=-d=checkptr=0"
  # The packages that run under -race (lore:test:race). -race only finds a data race on a path
  # where two goroutines really touch the same memory, so it runs where lore has real concurrency,
  # not on every package: in the old 15-minute race step, packages that start no goroutine of
  # their own (ops/settings 318 s, ops/task 204 s, ops/internal/lookup 182 s, app 509 s)
  # cost more than the concurrent ones. Every package still runs WITHOUT -race in lore:test:all.
  # Why each entry is here:
  #   engine/...          the keyed-create and write-path locks (sync.Mutex); tests write concurrently
  #   adapters/...        goroutines or locks in backend/git, backend/rowfs, backend/folder, cache/sqlite,
  #                       gitref, gitcommit, gitremote, live, mergewatch, orgcfg, probe, scanner/gitleaks,
  #                       secretmgr, selfupdate, signals, llmcall, with their own concurrent tests
  #                       (orgcfg linkwrite_race, selfupdate lockrace, gitleaks concurrent, signals write)
  #   logic/...           logic/clock and model/hlc share a clock under a mutex; logic/rowscan starts
  #   model/...           goroutines; logic/merge* is the sync merge path (cheap: about 10 s together)
  #   store/...           memstore and the backend contract suite guard state with a mutex
  #   surface/rest/...    HTTP servers: every request is its own goroutine
  #   surface/setupweb/...
  #   ops/setup/...       the setup probes run concurrently (goroutines in ops/setup)
  #   ops/memory/...      addkey_test writes the same key from many goroutines
  #   ops/doctor/...      Parallel runs a doctor run's checks on up to min(4, CPUs) goroutines
  #   wire, wire/host     gitexec pipes, setup discover/probe/aliases goroutines, the host's live
  #                       session locks, the coordination and heartbeat daemons
  #   tests/teame2e/teamharness/...   the team harness drives actors from goroutines
  # wire/renderhost (75 s under -race) has no goroutine or lock and is left plain. Add a package
  # here in the same commit that gives it a goroutine, a channel or a lock.
  RACE_PKGS: >-
    ./engine/... ./adapters/... ./logic/... ./model/... ./store/...
    ./surface/rest/... ./surface/setupweb/... ./ops/setup/... ./ops/memory/... ./ops/doctor/...
    ./wire ./wire/host ./tests/teame2e/teamharness/...
  # app (the command, tested in package app) is NOT in the race set. Its own code starts no goroutine; its one lock (apiRunner,
  # serialising `lore api` requests) only meets a second goroutine under a real HTTP server, and
  # its tests call the handler's ServeHTTP one request at a time, so a race build of app
  # (509 s in the old gate) could not find a race there. The REST server's own concurrency is
  # raced in surface/rest/...; app's multi-clone tests run the binary as separate processes,
  # which the race detector does not see across. Add it back with a test that drives concurrent
  # requests through apiRunner.
  # Folder of the per-step logs and timing tables of lore:check (gitignored tmp/).
  GATE_LOG_DIR: "{{.ROOT_DIR}}/tmp/check"
  # The gate's load budget: how many cores its steps may keep busy at once (GATE_SLOTS of
  # tests/lib/gate-parallel.sh; each step names its cores). 40 of the 48-core gate server: the
  # load stays under the core count, so no step waits for a core and the kernel does not spend
  # the CPU switching between hundreds of runnable processes (the old e2e stage averaged a load
  # of 161 and spent 42 % of its CPU in the kernel). One full gate runs at a time (testlock).
  # Override for another machine: GATE_SLOTS=12 task check.
  GATE_SLOTS: '{{env "GATE_SLOTS" | default "40"}}'
  # Every step of the gate (lore:check), one per line: name, the cores it keeps busy on average
  # (its share of GATE_SLOTS: CPU seconds / wall seconds measured in the gate of 2026-11-11 at
  # the -parallel, JOBS or SHARDS it is given), the task with its vars. Heaviest first, so the
  # steps that take longest at their share never start late: tests/lib/gate-parallel.sh starts
  # them in this order as cores free up. The journeys are long walks of a few serial tests, so
  # they cost few cores but go early too. Each e2e step builds its own binary under its own name (lore-team,
  # lore-docs-verify, lore-setupe2e, lore-machines-<part>, lore-journeys-<part>, userscen's temp
  # dir), so no two steps write one file. lore:check:fast runs a subset of these same lines
  # (FAST_MAP). tests/lib/gate-steps.sh reads the table.
  GATE_STEPS: |
    userscen          13  test:scen PARALLEL=13
    setupe2e          11  test:setupe2e:run PARALLEL=10
    journey-teamlead  3   test:journeys:teamlead PARALLEL=2
    journey-solo      2   test:journeys:solo PARALLEL=4
    machines          7   test:machines:core PARALLEL=8
    journey-agency    2   test:journeys:agency PARALLEL=2
    journey-joiner    2   test:journeys:joiner PARALLEL=2
    sweep-rest        7   test:machines:sweep:rest PARALLEL=8
    teame2e           7   test:team:run PARALLEL=10
    race-wire         12  test:race:wire SHARDS=6
    life-teams        4   test:machines:life:teams PARALLEL=4
    test-all          6   test:all
    docs-examples     5   docs:examples:verify JOBS=4
    sweep-tasks       4   test:machines:sweep:tasks PARALLEL=4
    nopush            4   test:machines:nopush PARALLEL=8
    life-setups       3   test:machines:life:setups PARALLEL=3
    life-objects      3   test:machines:life:objects PARALLEL=3
    life-rest         3   test:machines:life:rest PARALLEL=3
    journey-agents    2   test:journeys:agents PARALLEL=2
    journey-folders   2   test:journeys:folders PARALLEL=2
    journey-land      2   test:journeys:land PARALLEL=2
    journey-upgrader  2   test:journeys:upgrader PARALLEL=2
    journey-rest      2   test:journeys:rest PARALLEL=2
    scenarios         3   scenarios:run JOBS=4
    chaos             1   chaos:run JOBS=4
    race              2   test:race:rest
    cross-builds      4   build:cross
    cross-tests       6   build:cross:tests
    staticcheck       2   lint:staticcheck
    vet               2   lint:vet
    journey-frame     1   test:journeys:frame PARALLEL=1
    gofmt             1   lint:fmt
    tidy              1   check:tidy
    docsync           1   check:docs
  # Lines lore:check:fast puts in front of GATE_STEPS (same format; a name listed twice keeps
  # its first line). Empty: the fast tier's race step (race-changed, lore:test:race:changed) was
  # dropped to keep it to 2-3 minutes; the full gate's race steps cover it.
  FAST_EXTRA_STEPS: ""
  # The steps lore:check:fast always runs, whatever the change (names from GATE_STEPS and
  # FAST_EXTRA_STEPS); FAST_MAP adds the end-to-end ones. No docs step (docs-examples, docsync)
  # and no Windows/macOS test compile (cross-tests, ~27 CPU minutes): the full gate runs them.
  # The race detector (race-changed, race-wire, race) is the full gate's: with it the fast tier
  # took over 5 minutes on a loaded shared server.
  FAST_UNIT_STEPS: "test-all cross-builds staticcheck vet gofmt tidy"
  # The fast tier's mapping (lore:check:fast): which end-to-end steps of GATE_STEPS a change
  # needs, by the paths it changes. One rule per line, "<bash glob> <step>..." ("-" = no e2e
  # step); the first rule that matches a changed file wins (tests/lib/fast-plan.sh).
  #
  # The fast tier is a quick sanity check that fits in about 5 minutes on the shared server:
  # build, vet, gofmt, staticcheck, tidy, the release cross-builds, every unit test (the layer
  # and no-any guards are unit tests) and the race detector on the touched race-set packages.
  # No end-to-end suite runs in it (userscen, teame2e, setupe2e, machines, the sweeps and life
  # parts, the journeys, scenarios, chaos, the docs examples and docsync): with them it took
  # 22 minutes (1340 s, 2026-11-13). The full gate (lore:check, and lore:check:after-land on
  # the landed main) runs every step and is the real gate; what fails there is fixed in the
  # next change. A narrow step a path really needs can be named here again, if it fits.
  FAST_MAP: |
    *                               -
  # Runs one step of lore:check as its own task process (tests/lib/gate-parallel.sh starts each
  # step in a separate shell). TASKFILE is this file's own path, so it works when this file is
  # included as `lore:` and when it is run alone with `task -t Taskfile.lore.yml`.
  SELF: 'task --taskfile "{{.TASKFILE}}"'

tasks:
  build:
    desc: "Build the lore release binary from ./cmd/lore (pure-Go sqlite, CGO off, version stamped; same ldflags as the release build)"
    vars:
      VERSION:
        sh: git describe --tags --match 'v*' --always --dirty 2>/dev/null || echo dev
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # -buildvcs=auto on the command line wins over the GOFLAGS above: the binary a person
      # installs keeps its commit (the setup page's About shows it).
      - CGO_ENABLED=0 go build -trimpath -buildvcs=auto -ldflags='-buildid= -s -w -X main.version={{.VERSION}}' -o {{.LORE_BIN}} ./cmd/lore
      - echo "Built {{.LORE_BIN}} ({{.VERSION}})"

  build:warm:
    desc: "Compile every package of the root module once, plain and in the race set's -race variant, so the gate's parallel steps find them in Go's build cache instead of each compiling the same packages at the same time (lore:check's warm stage; next to free when the cache already has them)"
    cmds:
      # Why: after the cache was emptied (check:gocache, or another worktree's gate), ~20 steps
      # started together and each compiled lore, the modernc SQLite translation and the test
      # packages on its own: gate run 1 of 2026-11-11 spent most of its first minutes compiling
      # the same code many times over. Build tags do not change a shared package's cache entry,
      # so one plain and one race compile serve every step.
      - go build ./...
      - go build -race -gcflags='{{.RACE_GCFLAGS}}' {{.RACE_PKGS}}

  build:test:
    desc: "Build tmp/bin/lore for the gate's shell scenarios and chaos runs: the test version \"dev\" and no VCS stamp, so a new commit does not change how the binary is built (lore:build stamps the real version)"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -ldflags='-buildid= -s -w' -o {{.LORE_BIN}} ./cmd/lore
      - echo "Built {{.LORE_BIN}} (dev, test build)"

  spec:
    desc: "Regenerate docs/reference/cli-commands.md and openapi.json from the 0.1.18 operation registry (the wire drift test fails until this is run). Runs the binary from a temp folder so it never touches this repo's hooks"
    deps: [build]
    cmds:
      - cd "$(mktemp -d)" && {{.LORE_BIN}} spec docs --out {{.ROOT_DIR}}/docs/reference && {{.LORE_BIN}} spec openapi --out {{.ROOT_DIR}}/docs/reference

  build:debug:
    desc: "Build lore (./cmd/lore) with debug symbols"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.LORE_BIN}} ./cmd/lore

  install:
    desc: "Install lore (./cmd/lore) to $GOPATH/bin"
    deps: [build]
    cmds:
      - cp {{.LORE_BIN}} $(go env GOPATH)/bin/lore
      - echo "Installed to $(go env GOPATH)/bin/lore"

  skill:install:
    desc: "Install lore Claude skill to ~/.claude/skills/lore"
    vars:
      SKILL_SRC: "{{.ROOT_DIR}}/skills"
      SKILL_DEST: "{{.HOME}}/.claude/skills/lore"
    cmds:
      - mkdir -p "{{.SKILL_DEST}}"
      - rsync -a --delete "{{.SKILL_SRC}}/" "{{.SKILL_DEST}}/"
      - echo "Installed skill to {{.SKILL_DEST}}"

  install:all:
    desc: "Build + install aicoder binary AND install Claude skill"
    cmds:
      - task: install
      - task: skill:install

  test:quick:
    desc: "QUICK tier, run it all the time while building: every unit test of the root module, Go test cache on, no -race, no end-to-end suites (userscen, teame2e, setupe2e and the shell/docs runners are behind build tags or in lore:check). Extra go test flags after --, e.g. task lore:test:quick -- ./ops/task/..."
    cmds:
      # Not wrapped in testlock on purpose: it is the tier agents run between edits and must not
      # queue behind a full lore:check of another session. No -count=1 (the cache is the point:
      # go test reruns a package when its code, the env vars or the files it reads change) and the
      # same flags as lore:test:all, so the two share one test cache.
      - go test {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}
      # The fast real-machine shapes (foreign files, env, links, shapes; ~45 s on a loaded 48-core server) run here too, so a
      # change that breaks a real home is seen between edits, not only at the gate. Skipped when
      # CLI_ARGS narrows the run to some packages.
      - >-
        {{if not .CLI_ARGS}}{{.SELF}} test:machines:part PART=quick FILTER="-run '^Test(Foreign|Env|Links|Shapes)'"{{end}}

  test:
    desc: "Unit + integration tests: every package plain (lore:test:all) and the concurrent packages under the race detector (lore:test:race), in parallel"
    deps: [test:all, test:race]

  test:race:
    desc: "Race detector on the packages with real concurrency, RACE_PKGS (engine, adapters, logic, model, store, surface/rest, surface/setupweb, ops/setup, ops/memory, ops/doctor, wire, wire/host, teamharness); Taskfile.lore.yml says why each is there. The two parts below run in parallel"
    deps: [test:race:rest, test:race:wire]

  test:race:rest:
    desc: "The race set without ./wire (lore:test:race:wire runs it in shards)"
    cmds:
      - go test -p 8 -race -gcflags='{{.RACE_GCFLAGS}}' -timeout 40m $(printf '%s\n' {{.RACE_PKGS}} | grep -vx './wire')

  test:race:wire:
    desc: "./wire under the race detector in SHARDS processes of one test binary (tests/lib/gotest-shards.sh): 123 of its 569 tests are serial (113 use t.Setenv), so one process took 200 s while the rest of the race set took 25 s"
    vars:
      SHARDS: '{{.SHARDS | default "6"}}'
    cmds:
      # GOMAXPROCS=4 per shard: each shard's parallel tests run on at most four cores, so the
      # six shards stay near their share of the gate's load budget (run unbounded, the shards
      # took 13 cores on average and bursts far above).
      - GOMAXPROCS=4 tests/lib/gotest-shards.sh {{.SHARDS}} ./wire -race -gcflags='{{.RACE_GCFLAGS}}' -timeout 40m

  test:race:changed:
    desc: "Race detector on the RACE_PKGS packages that hold a changed .go file (since the merge base with FAST_BASE, default origin/main; go.mod/go.sum changes select the whole set; tests/lib/fast-plan.sh race). Part of lore:check:fast"
    env:
      RACE_PKGS: "{{.RACE_PKGS}}"
    cmds:
      - |
        pkgs=$(tests/lib/fast-plan.sh race)
        if [ -z "$pkgs" ]; then
          echo "no race-set package changed"
          exit 0
        fi
        echo "race on:" $pkgs
        # ./wire goes through the same shards as the full gate (lore:test:race:wire); one process
        # of it alone took 200 s.
        rest=$(printf '%s\n' $pkgs | grep -vx './wire' || true)
        rc=0
        if printf '%s\n' $pkgs | grep -qx './wire'; then
          GOMAXPROCS=4 tests/lib/gotest-shards.sh 6 ./wire -race -gcflags='{{.RACE_GCFLAGS}}' -timeout 40m & wire=$!
        fi
        if [ -n "$rest" ]; then
          go test -p 8 -race -gcflags='{{.RACE_GCFLAGS}}' -timeout 40m $rest || rc=1
        fi
        if [ -n "${wire:-}" ]; then wait "$wire" || rc=1; fi
        exit $rc

  test:all:
    desc: "Every Go test of the root module without -race, incl. cmd/lore's docs drift test (the team suite is lore:test:team)"
    cmds:
      # No -count=1: go test reruns a package when its code, the env vars or the files it reads change.
      # -p 8: at most eight package test binaries at once (each runs its parallel tests on every
      # core), the cap of one go test process in the gate's load budget.
      - go test -p 8 ./...

  check:tidy:
    desc: "Fail when `go mod tidy` would change go.mod or go.sum (go mod tidy -diff: never writes them)"
    cmds:
      - |
        # -diff never writes go.mod or go.sum, so this step can run while other gate steps
        # build and test from the same files.
        if ! go mod tidy -diff; then
          echo "✘ go mod tidy would change go.mod or go.sum — run it and commit the result"
          exit 1
        fi
        echo "✓ go mod tidy: no changes"

  check:docs:
    desc: "Docs cite code through docsync: every citation still matches (ds check). Command/flag drift is TestDocsMatchCLI in test:all"
    cmds:
      - |
        # `go install` puts ds in $(go env GOPATH)/bin, which a gate's PATH
        # (a non-login shell, the after-land runner) may not hold: look there too.
        if ! command -v ds >/dev/null 2>&1; then
          PATH="$PATH:$(go env GOPATH)/bin"
        fi
        if ! command -v ds >/dev/null 2>&1; then
          echo "✘ ds (docsync) is not installed (not on PATH, nor in \$(go env GOPATH)/bin), so doc citations cannot be checked"
          exit 1
        fi
        # ds scan rewrites .ds/ledger.tsv and refs.tsv (their header records
        # the commit and time of every scan). A gate must not change tracked
        # files, so they are put back after checking; refresh them on purpose
        # with `ds scan` and commit when docs or citations change.
        keep=$(mktemp -d)
        cp .ds/ledger.tsv .ds/refs.tsv "$keep"/
        status=0
        ds scan >/dev/null && ds check || status=$?
        cp "$keep/ledger.tsv" "$keep/refs.tsv" .ds/
        rm -rf "$keep"
        exit $status

  check:gocache:
    desc: "Empty Go's build cache (go clean -cache) when it is over LORE_GOCACHE_MAX_GB (default 50); LORE_GOCACHE_TRIM=dry only reports, =off skips. The first step of lore:check; touches no tracked file (tests/lib/gocache-trim.sh)"
    cmds:
      - tests/lib/gocache-trim.sh

  check:begin:
    desc: "Record the tracked files' tree before the gate runs (check:stamp compares against it)"
    cmds:
      - '"{{.TRACKED_TREE}}" > "$(git rev-parse --git-path {{.CHECK_BEGIN}})"'
      # a fresh log folder, so the timing table lists this run only (literal path under tmp/)
      - rm -rf "{{.ROOT_DIR}}/tmp/check"

  check:stamp:
    desc: "Record that the gate passed for the tracked files as they are now (read by the pre-push hook); refused if they changed while it ran. STAMP names the file inside .git (default the full gate's; check:fast passes its own)"
    vars:
      STAMP: '{{.STAMP | default .CHECK_STAMP}}'
    cmds:
      - |
        set -e
        begin_file=$(git rev-parse --git-path {{.CHECK_BEGIN}})
        tree=$("{{.TRACKED_TREE}}")
        if [ -f "$begin_file" ] && [ "$(cat "$begin_file")" != "$tree" ]; then
          echo "✘ tracked files changed while the gate ran, so it did not test one version of the code:"
          git diff-tree -r --name-only "$(cat "$begin_file")" "$tree" | sed 's/^/    /'
          echo "  (a gate step must not modify tracked files; or an edit happened during the run)"
          exit 1
        fi
        echo "$tree" > "$(git rev-parse --git-path {{.STAMP}})"
        echo "✓ gate passed for tree $tree ({{.STAMP}})"

  check:
    desc: "FULL tier, THE gate — run before every push (the pre-push hook enforces it; a small fix may land on lore:check:fast, then this runs on main): bound the Go cache, compile once, build, then every step of GATE_STEPS (lint, cross-builds, the Windows and macOS compile check of every package with its tests (cross-tests), tidy, docsync, every unit test, the race set, every end-to-end suite) under the GATE_SLOTS load budget, heaviest first; per-step logs, wall and CPU times in tmp/check"
    cmds:
      - testlock task --taskfile "{{.TASKFILE}}" check:run

  check:run:
    desc: "Body of lore:check WITHOUT the machine-wide test lock; call lore:check instead"
    env:
      GATE_LOG_DIR: "{{.GATE_LOG_DIR}}"
      GATE_STEPS: "{{.GATE_STEPS}}"
      GATE_SELF: "{{.SELF}}"
    cmds:
      - task: check:begin
      # Stage cache: bound the shared Go build cache before anything builds (check:gocache), alone,
      # because emptying it under a running build would fail that build.
      - tests/lib/gate-parallel.sh cache 'gocache={{.SELF}} check:gocache'
      # Stage warm: compile the module once (plain and race) before the steps that all use it.
      - tests/lib/gate-parallel.sh warm 'warm={{.SELF}} build:warm'
      # Stage build: the test binary the shell scenarios and chaos runs use (build:test: version
      # "dev", no VCS stamp). Built alone first because scenarios and chaos only read it; their
      # public tasks rebuild it (deps: [build]), which two parallel steps must not do to one path.
      - tests/lib/gate-parallel.sh build 'build={{.SELF}} build:test'
      # Stage test: every check, unit and end to end, in ONE stage under the load budget
      # (GATE_SLOTS cores; tests/lib/gate-parallel.sh starts each step when its cores are free,
      # in the order of GATE_STEPS, which says why it is longest first). Per-step wall and CPU
      # seconds and the load are printed at the end (tmp/check/timings.tsv, stages.tsv).
      - GATE_SLOTS={{.GATE_SLOTS}} tests/lib/gate-steps.sh test
      - task: check:stamp
      - echo "✓ task check — every gate passed (logs in {{.GATE_LOG_DIR}})"

  check:fast:
    desc: "FAST tier for landing a small fix, a 2-3 minute sanity check that takes no machine-wide test lock: build, vet, gofmt, staticcheck, cross-builds, tidy and every unit test (go test ./..., cached); no race detector, no end-to-end suite and no docs step (FAST_MAP names none; the full gate after landing runs them all). Writes its own stamp (lore-check-fast-passed), which the pre-push hook accepts; the full gate then runs on the landed main (lore:check:after-land). docs/DEVELOPMENT.md \"Landing\""
    cmds:
      # Not behind testlock: the fast tier is a 2-3 minute sanity check and must never queue
      # behind another session's full gate; only the full gate (lore:check) takes the lock.
      # SKIP_DOCS reaches the inner task as an argument.
      - task --taskfile "{{.TASKFILE}}" check:fast:run SKIP_DOCS='{{.SKIP_DOCS}}'

  check:fast:run:
    desc: "Body of lore:check:fast (no machine-wide test lock, like lore:check:fast itself); call lore:check:fast instead"
    env:
      GATE_LOG_DIR: "{{.GATE_LOG_DIR}}"
      GATE_STEPS: "{{.FAST_EXTRA_STEPS}}{{.GATE_STEPS}}"
      GATE_SELF: "{{.SELF}}"
      FAST_MAP: "{{.FAST_MAP}}"
      RACE_PKGS: "{{.RACE_PKGS}}"
      SKIP_DOCS: "{{.SKIP_DOCS}}"
    cmds:
      - task: check:begin
      # No cache stage: trimming the shared Go build cache is safe only under the full gate's
      # testlock, and the fast tier takes no lock.
      - tests/lib/gate-parallel.sh warm 'warm={{.SELF}} build:warm'
      - tests/lib/gate-parallel.sh build 'build={{.SELF}} build:test'
      - |
        set -e
        e2e=$(tests/lib/fast-plan.sh steps)
        echo "changed files: $(tests/lib/fast-plan.sh files | wc -l | tr -d ' ') (since the merge base with ${FAST_BASE:-origin/main})"
        echo "end-to-end steps for them: ${e2e:-none}" | tr '\n' ' '; echo
        # shellcheck disable=SC2086 # step names are single words
        steps=$(tests/lib/fast-plan.sh keep {{.FAST_UNIT_STEPS}} $e2e)
        case "${SKIP_DOCS:-}" in ""|0) ;; *) echo "SKIP_DOCS=$SKIP_DOCS: nothing to drop, the fast tier runs no docs step (the full gate on main runs them)" ;; esac
        # shellcheck disable=SC2086
        GATE_SLOTS={{.GATE_SLOTS}} tests/lib/gate-steps.sh fast $steps
      - task: check:stamp
        vars: {STAMP: "{{.CHECK_FAST_STAMP}}"}
      - echo "✓ task check:fast passed (logs in {{.GATE_LOG_DIR}}); the full gate runs on main after landing (task check:after-land)"

  check:after-land:
    desc: "The full gate on what landed: fetch origin, a fresh worktree of origin/main in a temp folder, task check there, then the result in LORE_GATE_REPORT (default ~/.local/state/lore-gate/last.md; first line PASS or FAIL with the commit, then the step timings) with the step logs beside it. Run it right after landing a fix that passed only check:fast; a FAIL is fixed at once (docs/DEVELOPMENT.md \"Landing\")"
    cmds:
      - tests/lib/after-land.sh

  hooks:install:
    desc: "Use the repo's committed hooks (.githooks): pre-push runs `task check` unless it already passed for the exact code being pushed"
    cmds:
      - chmod +x .githooks/*
      - git config --local core.hooksPath .githooks
      - echo "✓ hooks installed (core.hooksPath = .githooks)"

  test:sync:
    desc: "Git-sync tests only: row merge (logic/merge, merge3, canonjson), the live ref, branch sync and the sync operations; the end-to-end sync tests are in lore:test:team"
    cmds:
      - go test -race -gcflags='{{.RACE_GCFLAGS}}' ./logic/merge/... ./logic/merge3/... ./logic/canonjson/... ./adapters/live/... ./adapters/reposync/... ./ops/sync/...

  test:scen:
    desc: "User-scenario suite (tests/userscen): every user-facing feature through the real binary, temp HOME, real git. Extra go test flags after --"
    cmds:
      # -timeout 60m: the trash matrix alone takes ~8 min (26 kinds x 3 stores).
      # -count=1: TestMain builds cmd/lore in a subprocess (go build), and the test cache keys
      # only on the userscen package's own sources, the env vars it reads and the files the
      # test process opens, never on the lore sources that subprocess compiles. A cached pass
      # would replay after any change to lore itself, so this step (and the userscen step of
      # task check, which calls it) always runs the binary built from the current tree.
      # -parallel: how many scenarios run at once (each drives lore processes one after another);
      # the gate passes its share of the load budget, a manual run uses 32.
      - "CGO_ENABLED=0 go test -tags userscen -count=1 -parallel {{.PARALLEL | default 32}} -timeout 60m ./tests/userscen/... {{.CLI_ARGS}}"

  test:team:
    desc: "Team e2e suite (LORE_TEAM_SPEC.md): real binary, real git, many actors. Not built yet = PENDING (skip); LORE_TEAM_STRICT=1 fails pending tests, LORE_TEAM_FORCE=1 skips the capability probe. Extra go test flags after --"
    cmds:
      - testlock task lore:test:team:run -- {{.CLI_ARGS}}

  test:team:run:
    desc: "Body of lore:test:team WITHOUT the machine-wide test lock; call lore:test:team instead"
    vars:
      TEAM_BIN: "{{.BIN_DIR}}/lore-team"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW (test clock).
      - CGO_ENABLED=0 go build -tags loretest -o {{.TEAM_BIN}} ./cmd/lore
      # go test -json → pass / FAIL / pending matrix; exits 1 only on real failures
      # (pipefail so a build failure of the test binary is not swallowed by the pipe).
      # -count=1: the tests run the outside binary LORE_TEAM_BIN, which the test cache does not
      # track, so a cached pass could hide a rebuilt binary's failure.
      # -timeout 40m: go test's default 10 min is a wall-clock limit on the whole
      # package; beside the other e2e steps of lore:check (load above 70) the suite
      # took 630 s and the default killed a passing test mid-run.
      - |
        set -o pipefail
        # -parallel: how many team tests run at once (the gate passes its share of the load
        # budget; a manual run uses 24).
        LORE_TEAM_BIN={{.TEAM_BIN}} go test -tags teame2e -count=1 -parallel {{.PARALLEL | default 24}} -timeout 40m -json -run '^Test(F[0-9]|E[0-9][0-9]_|Recipe|SideEffect|Leak|Next|Worked|APIParity|LockOrderRanks$)' ./tests/teame2e/ {{.CLI_ARGS}} \
          | go run ./tests/teame2e/teamharness/matrix

  test:setupe2e:
    desc: "Setup page e2e suite (tests/setupe2e, tag setupe2e): every valid machine shape (1764) through the real binary's HTTP API. Fails, never skips, when a world or the server cannot start. Narrow with SETUPE2E_ONLY=<text in the shape name>"
    cmds:
      - testlock task lore:test:setupe2e:run

  test:setupe2e:run:
    desc: "Body of lore:test:setupe2e WITHOUT the machine-wide test lock; call lore:test:setupe2e instead"
    vars:
      SETUPE2E_BIN: "{{.BIN_DIR}}/lore-setupe2e"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # built once; every world runs this binary
      - CGO_ENABLED=0 go build -o {{.SETUPE2E_BIN}} ./cmd/lore
      # -count=1: the tests run the outside binary SETUPE2E_LORE, which the test cache does not track.
      # -parallel 32, not the default 48 (GOMAXPROCS on a 48-core machine): measured 2026-11-07 back to back,
      # 189 s at 32 vs 194 s at 48; each shape spawns lore processes, so more Go-level
      # parallelism only adds load.
      # PARALLEL: the gate passes its share of the load budget.
      - "SETUPE2E_LORE={{.SETUPE2E_BIN}} go test -tags setupe2e -count=1 -parallel {{.PARALLEL | default 32}} -timeout 60m -run '^(TestAPIMatrix|TestBinaryServesDefaultUI|TestPairwiseCoversEveryPair|TestShapeValidate)$' ./tests/setupe2e/"

  test:machines:
    desc: "Real-machine suite (tests/machines, tag machines): homes shaped like real users' (fresh, v0.1.17, migrated with *.migrated backups, several gh accounts and ssh aliases with a key without .pub, org member, setups disabled/trashed/purged) and every valid 4-step setup lifecycle sequence on them, checking after each step that nothing purged or trashed is offered, disabled never applies, config check knows every key, doctor --all reports, and repo files are 0644 / ~/.lore owner-only. MACHINES_FULL=1 runs every sequence on every shape"
    cmds:
      - testlock task lore:test:machines:run

  test:machines:run:
    desc: "Body of lore:test:machines WITHOUT the machine-wide test lock; call lore:test:machines instead"
    vars:
      MACHINES_BIN: "{{.BIN_DIR}}/lore-machines"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.MACHINES_BIN}} ./cmd/lore
      # -count=1: the tests run the outside binary MACHINES_LORE, which the test cache does not track.
      - MACHINES_LORE={{.MACHINES_BIN}} go test -tags machines -count=1 -parallel 32 -timeout 20m ./tests/machines/ {{.CLI_ARGS}}

  # The gate runs tests/machines as parallel parts (each its own binary name, each under ~3 min on
  # an idle 48-core server) instead of one package run; test:machines:run stays the whole package for a
  # manual run. The -run/-skip patterns together cover every test: core skips exactly what the
  # other parts run.
  test:machines:part:
    desc: "One part of the tests/machines suite with its own binary (PART names it, FILTER is the go test -run/-skip); the parts below call it"
    vars:
      MACHINES_BIN: "{{.BIN_DIR}}/lore-machines-{{.PART}}"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.MACHINES_BIN}} ./cmd/lore
      # PARALLEL: the gate passes each part's share of the load budget.
      - "MACHINES_LORE={{.MACHINES_BIN}} go test -tags machines -count=1 -parallel {{.PARALLEL | default 32}} -timeout 20m {{.FILTER}} ./tests/machines/"

  test:machines:core:
    desc: "tests/machines minus the sweep, life and REST parts: the shapes (built-in, links_*, env_*, foreign_*, repos_*), the 4-step setup sequences and the setup campaign"
    cmds:
      - task: test:machines:part
        vars: {PART: core, FILTER: "-skip '^Test(Sweep(Tasks|Reads|Knowledge|Rows|CoversEveryCommand|CheckersBite|SkillLinkRule)|Life(Setups|SetupEditAgreement|Teams|Objects)|Rest(Lifecycle|TeamStoreURL)|NoPushWithoutAsking(Examples)?)$'"}

  test:machines:sweep:tasks:
    desc: "Command sweep, task/mission/reminder lifecycles on every shape (answers right, disk right, doctor names what is left)"
    cmds:
      - task: test:machines:part
        vars: {PART: sweep-tasks, FILTER: "-run '^TestSweepTasks$'"}

  test:machines:sweep:rest:
    desc: "Command sweep, reads + knowledge kinds + rows on every shape, plus the coverage check (every leaf command swept or listed with a reason) and the checkers' own break tests"
    cmds:
      - task: test:machines:part
        vars: {PART: sweep-rest, FILTER: "-run '^TestSweep(Reads|Knowledge|Rows|CoversEveryCommand|CheckersBite|SkillLinkRule)$'"}

  test:machines:nopush:
    desc: "No push without asking (S-1): with push=manual and live.autopush off, every command of the sweep table and every example of every command, in two code repos and two store clones with bare remotes, leaves every remote ref as it was; then every read on the defaults with commits waiting"
    cmds:
      - task: test:machines:part
        vars: {PART: nopush, FILTER: "-run '^TestNoPushWithoutAsking(Examples)?$'"}

  test:machines:life:setups:
    desc: "Solo setup lifecycle through the binary on every shape (create, edit every step, rename, default, purge, re-add, import, edit, remove) and the check/apply name agreement for an existing setup"
    cmds:
      - task: test:machines:part
        vars: {PART: life-setups, FILTER: "-run '^TestLife(Setups|SetupEditAgreement)$'"}

  test:machines:life:teams:
    desc: "Member and admin (start a team) setup lifecycles through the binary on every shape, against a local git server fake"
    cmds:
      - task: test:machines:part
        vars: {PART: life-teams, FILTER: "-run '^TestLifeTeams$'"}

  test:machines:life:objects:
    desc: "Lifecycles of stores, skills, identity, personal store, machine label, live and row trash through the binary on every shape"
    cmds:
      - task: test:machines:part
        vars: {PART: life-objects, FILTER: "-run '^TestLifeObjects$'"}

  test:machines:life:rest:
    desc: "Setup lifecycle through the setup page's REST API on every shape, checked against the CLI on the same home after each transition"
    cmds:
      - task: test:machines:part
        vars: {PART: life-rest, FILTER: "-run '^TestRest(Lifecycle|TeamStoreURL)$'"}

  test:journeys:
    desc: "Real-user journey suite (tests/journeys, tag journeys): each persona lives with lore over weeks through the real binary (loretest build, LORE_NOW clock), and after every step the shared invariants run on every machine (readable output, doctor, config, file modes) plus the journey's own facts. How to add a persona, step or invariant: tests/journeys/README.md. JOURNEYS_STRICT=1 fails steps marked Pending on another branch. Extra go test flags after --"
    cmds:
      - task: test:journeys:part
        vars: {PART: all, FILTER: "{{.CLI_ARGS}}"}

  test:journeys:part:
    desc: "One part of tests/journeys with its own binary (PART names it, FILTER is the go test -run); the gate's journey-* steps call it"
    vars:
      JOURNEYS_BIN: "{{.BIN_DIR}}/lore-journeys-{{.PART}}"
    cmds:
      - CGO_ENABLED=0 go build -tags loretest -o {{.JOURNEYS_BIN}} ./cmd/lore
      - "JOURNEYS_LORE={{.JOURNEYS_BIN}} go test -tags journeys -count=1 -parallel {{.PARALLEL | default 16}} -timeout 15m {{.FILTER}} ./tests/journeys/"

  test:journeys:frame:
    desc: "Journey harness self-tests: a walk through every harness action, every shared invariant bites, Pending records"
    cmds:
      - task: test:journeys:part
        vars: {PART: frame, FILTER: "-run '^TestFrame'"}

  test:journeys:land:
    desc: "Journeys of one landing round (tests/journeys/land*_test.go, tests named TestJourneyLand…): e.g. a person with many repos whose doctor --all stays in budget and light on git, and whose trivial commands start without git"
    cmds:
      - task: test:journeys:part
        vars: {PART: land, FILTER: "-run '^TestJourneyLand'"}

  test:journeys:solo:
    desc: "Journey: Solo dev over six months: install, two repos, offline and interrupted pushes, rename and new email/account/key, moved repo and folder, new laptop and the old one again, upgrade, tool swap, a personal store with thousands of rows"
    cmds:
      - task: test:journeys:part
        vars: {PART: solo, FILTER: "-run '^TestJourneySolo'"}

  test:journeys:agency:
    desc: "Journey: Agency dev: internal store plus client repos, no leak into a client repo, moved client repo, a client project ends, offboard and rejoin"
    cmds:
      - task: test:journeys:part
        vars: {PART: agency, FILTER: "-run '^TestJourneyAgency'"}

  test:journeys:teamlead:
    desc: "Journey: Team lead: start a team, invite three, leave, rename, admin change, a week offline with unpushed work, two edits of one row, compact with unpushed work"
    cmds:
      - task: test:journeys:part
        vars: {PART: teamlead, FILTER: "-run '^TestJourneyTeamLead'"}

  test:journeys:joiner:
    desc: "Journey: New joiner: invite on day 1 beside an existing personal setup (two setups, overlapping folders), later leaves job A"
    cmds:
      - task: test:journeys:part
        vars: {PART: joiner, FILTER: "-run '^TestJourneyJoiner'"}

  test:journeys:agents:
    desc: "Journey: Coding agents: Claude Code and Codex sessions writing beside the human, a session ending mid-write, detection on/off, lore api beside the CLI"
    cmds:
      - task: test:journeys:part
        vars: {PART: agents, FILTER: "-run '^TestJourneyAgents'"}

  test:journeys:folders:
    desc: "Journey: an admin makes and lists the team store's client folders from a plain parent folder (no git repo), then a client repo attaches one; store-only commands leave the repo they run in alone"
    cmds:
      - task: test:journeys:part
        vars: {PART: folders, FILTER: "-run '^TestJourneyFolders'"}

  test:journeys:upgrader:
    desc: "Journey: Upgrader from v0.1.17: old lore.db, hooks and config, migrate, old and new binaries on two machines for a week; and from an earlier 0.1.18 build: old store clones and store trees moved to the plain layout on first run (oldlayout_test.go)"
    cmds:
      - task: test:journeys:part
        vars: {PART: upgrader, FILTER: "-run '^TestJourneyUpgrader'"}

  # The parts above run the journeys their -run names; journey-rest runs every other test of the
  # package (-skip of exactly those names), so a new journey is in the gate the day it is added.
  # tests/journeys/gate_parts_test.go fails when a test is in no part or in two, and when a part
  # is missing from GATE_STEPS: keep its -skip in step with the parts above.
  test:journeys:rest:
    desc: "Every journey no named part runs (the catch-all of the gate's journey parts): staff, store commands, offline, pull --rebase, init in a linked repo, mixed versions on one store, moves, and every journey added later"
    cmds:
      - task: test:journeys:part
        vars: {PART: rest, FILTER: "-skip '^Test(Frame|Journey(Land|Solo|Agency|TeamLead|Joiner|Agents|Folders|Upgrader))'"}


  trial:github:
    desc: "MANUAL ONLY, never in CI or any automatic gate: the real-repo trial (docs/team/real-repo-trial.md). Needs two empty private repos you can push to, named by LORE_TRIAL_CLIENT_REMOTE and LORE_TRIAL_STORE_REMOTE; it deletes every ref of both (only when empty or carrying the trial's marker), builds lore from this checkout and runs every team step against them, then prints a pass/fail table"
    cmds:
      - tests/team/trial/run.sh

  test:team:lockranks:
    desc: "Team e2e suite with every test under the ranked lock watch (LORE_TEAM_LOCK_RANKS=1, FORMAT_EVOLUTION 7.5/7.8; Linux only): fails when any process takes a lock ranked before one it holds. Extra go test flags after --"
    cmds:
      - LORE_TEAM_LOCK_RANKS=1 task lore:test:team -- {{.CLI_ARGS}}

  test:team:race:
    desc: "Team e2e race tests repeated (default -count=5; override: task lore:test:team:race -- -count=10)"
    cmds:
      - testlock task lore:test:team:race:run -- {{.CLI_ARGS}}

  test:team:race:run:
    desc: "Body of lore:test:team:race WITHOUT the machine-wide test lock; call lore:test:team:race instead"
    vars:
      TEAM_BIN: "{{.BIN_DIR}}/lore-team"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -tags loretest -o {{.TEAM_BIN}} ./cmd/lore
      - LORE_TEAM_BIN={{.TEAM_BIN}} go test -tags teame2e -race -run 'Race' -count=5 ./tests/teame2e/ {{.CLI_ARGS}}

  docs:examples:
    desc: "Run every docs/team example against the real binary (tests/team/docs/run-examples.sh), then refresh the pages from the transcripts (paste.py); fails when an example misbehaves or a page is stale. One section: task lore:docs:examples -- agents"
    cmds:
      - testlock task lore:docs:examples:run -- {{.CLI_ARGS}}

  docs:examples:run:
    desc: "Body of lore:docs:examples WITHOUT the machine-wide test lock; call lore:docs:examples instead"
    vars:
      DOCS_BIN: "{{.BIN_DIR}}/lore-docs"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW, so transcripts are stable.
      - CGO_ENABLED=0 go build -tags loretest -o {{.DOCS_BIN}} ./cmd/lore
      - LORE_BIN={{.DOCS_BIN}} tests/team/docs/run-examples.sh {{.CLI_ARGS}}
      - LORE_BIN={{.DOCS_BIN}} python3 tests/team/docs/paste.py

  docs:examples:core:
    desc: "Run every non-team docs example (tests/docs/run-examples.sh, one file per section in tests/docs/sections) against the real binary, then refresh docs/** (not docs/team) from the transcripts and regenerate the commands index; fails when an example misbehaves. One section: task lore:docs:examples:core -- start"
    cmds:
      - testlock task lore:docs:examples:core:run -- {{.CLI_ARGS}}

  docs:examples:core:run:
    desc: "Body of lore:docs:examples:core WITHOUT the machine-wide test lock; call lore:docs:examples:core instead"
    vars:
      DOCS_BIN: "{{.BIN_DIR}}/lore-docs"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW, so transcripts are stable.
      - CGO_ENABLED=0 go build -tags loretest -o {{.DOCS_BIN}} ./cmd/lore
      - LORE_BIN={{.DOCS_BIN}} tests/docs/run-examples.sh {{.CLI_ARGS}}
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/paste.py
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/commands_index.py

  docs:examples:core:check:
    desc: "Fail when a non-team docs page or the generated commands index is stale against the transcripts and the real binary (no examples are re-run)"
    vars:
      DOCS_BIN: "{{.BIN_DIR}}/lore-docs"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -tags loretest -o {{.DOCS_BIN}} ./cmd/lore
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/paste.py --check
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/commands_index.py --check

  docs:examples:verify:
    desc: "Re-run every docs example (tests/docs and tests/team/docs) against the real binary and fail when a transcript, a pasted page block or the commands index is stale. Changes no tracked file when the docs are current; when they are not, the fresh transcripts are left in place: refresh the pages with lore:docs:examples and lore:docs:examples:core and commit"
    vars:
      # its own name: lore:docs:examples(:core) build lore-docs, and lore:check runs this step
      # beside other steps that must not rebuild a binary it is running
      VERIFY_BIN: "{{.BIN_DIR}}/lore-docs-verify"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW, so transcripts are stable.
      - CGO_ENABLED=0 go build -tags loretest -o {{.VERIFY_BIN}} ./cmd/lore
      # Both runners at once, each running JOBS sections at a time (tests/lib/parallel-sections.sh);
      # every section has its own world and transcript. Each runner's output is printed after
      # both have ended, so the log reads as before.
      - |
        export LORE_BIN={{.VERIFY_BIN}} JOBS={{.JOBS | default 8}}
        logs=$(mktemp -d)
        tests/docs/run-examples.sh >"$logs/core" 2>&1 & core=$!
        tests/team/docs/run-examples.sh >"$logs/team" 2>&1 & team=$!
        rc=0
        wait $core || rc=1
        wait $team || rc=1
        cat "$logs/core" "$logs/team"
        rm -rf "$logs"
        exit $rc
      - |
        if ! git diff --quiet -- tests/docs/transcripts tests/team/docs/transcripts; then
          echo "✘ docs example transcripts changed when re-run:"
          git diff --stat -- tests/docs/transcripts tests/team/docs/transcripts
          exit 1
        fi
      - LORE_BIN={{.VERIFY_BIN}} python3 tests/docs/paste.py --check
      - LORE_BIN={{.VERIFY_BIN}} python3 tests/team/docs/paste.py --check
      - LORE_BIN={{.VERIFY_BIN}} python3 tests/docs/commands_index.py --check

  bench:meta:
    desc: "Metadata cache bench (METADATA 4, OQ6): generated store, rows x 20 keys; fails when first build, cache size or a warm two-filter search exceed the gate in metabench_test.go. ROWS=N overrides the row count"
    vars:
      ROWS: '{{.ROWS | default ""}}'
    cmds:
      - LORE_BENCH_META=1 {{if .ROWS}}LORE_BENCH_META_ROWS={{.ROWS}} {{end}}go test ./adapters/cache/sqlite/ -run '^TestMetaBench$' -v -timeout 60m

  test:cover:
    desc: "Coverage of the root module's tests; lists functions no test reaches"
    cmds:
      - |
        set -e
        # -count=1 kept: the run must write a fresh coverage profile; a cache replay writes none.
        go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./... >/dev/null
        go tool cover -func=coverage.out | tail -1
        echo "functions no test reaches:"
        go tool cover -func=coverage.out | awk '$NF == "0.0%"' || true

  build:cross:
    desc: "Cross-compile the release binary (./cmd/lore) for every shipped OS/arch (platform code must build everywhere, not just on the host)"
    # the six targets build in parallel (each writes /dev/null, nothing shared)
    deps:
      - {task: build:cross:one, vars: {GOOS: linux, GOARCH: amd64}}
      - {task: build:cross:one, vars: {GOOS: linux, GOARCH: arm64}}
      - {task: build:cross:one, vars: {GOOS: darwin, GOARCH: arm64}}
      - {task: build:cross:one, vars: {GOOS: darwin, GOARCH: amd64}}
      - {task: build:cross:one, vars: {GOOS: windows, GOARCH: amd64}}
      - {task: build:cross:one, vars: {GOOS: windows, GOARCH: arm64}}

  build:cross:one:
    desc: "Cross-compile ./cmd/lore for one GOOS/GOARCH (called by build:cross)"
    internal: true
    cmds:
      - CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -o /dev/null ./cmd/lore

  # build:cross builds only ./cmd/lore, so a test file (or a test-only helper) with OS-specific
  # code was never compiled for the other platforms: Windows-only code was built and vetted by
  # hand, never by the gate, and one e2e suite (setupe2e) did not even compile on Windows.
  # go vet type-checks every package with its test files for the target, runs nothing, and
  # needs no target machine; the tagged suites are checked too (their build tags may exclude
  # the target, as the journeys and machines suites exclude Windows).
  build:cross:tests:
    desc: "Compile-check every package with its tests (go vet, nothing runs) for Windows and macOS, the root module and the tagged end-to-end suites, so OS-specific code and tests are checked on every gate, not only on those machines"
    deps:
      - {task: build:cross:tests:one, vars: {GOOS: windows, GOARCH: amd64}}
      - {task: build:cross:tests:one, vars: {GOOS: darwin, GOARCH: arm64}}

  build:cross:tests:one:
    desc: "go vet the root module and the tagged suites for one GOOS/GOARCH (called by build:cross:tests)"
    internal: true
    env: {CGO_ENABLED: "0", GOOS: "{{.GOOS}}", GOARCH: "{{.GOARCH}}"}
    cmds:
      - go vet ./...
      # A suite whose build tags exclude the target (journeys and machines are !windows) has no
      # package there, and go vet refuses an empty pattern: skip it, named.
      - |
        for s in "teame2e ./tests/..." "setupe2e ./tests/setupe2e/..." "machines ./tests/machines/..." "journeys ./tests/journeys/..." "userscen ./tests/userscen/..."; do
          set -- $s
          if [ -z "$(go list -tags "$1" "$2" 2>/dev/null)" ]; then echo "{{.GOOS}}: $1 suite does not build there (its build tags), skipped"; continue; fi
          go vet -tags "$1" "$2" || exit 1
        done

  lint:
    desc: "Static checks: vet + fmt + staticcheck + cross-OS build, in parallel"
    deps: [build:cross, lint:vet, lint:fmt, lint:staticcheck]

  lint:vet:
    desc: "go vet on the root module and on the tagged end-to-end suites"
    cmds:
      - go vet ./...
      # A suite whose build tags exclude the target (journeys and machines are !windows) has no
      # package there, and go vet refuses an empty pattern: skip it, named.
      - |
        for s in "teame2e ./tests/..." "setupe2e ./tests/setupe2e/..." "machines ./tests/machines/..." "journeys ./tests/journeys/..." "userscen ./tests/userscen/..."; do
          set -- $s
          if [ -z "$(go list -tags "$1" "$2" 2>/dev/null)" ]; then echo "{{.GOOS}}: $1 suite does not build there (its build tags), skipped"; continue; fi
          go vet -tags "$1" "$2" || exit 1
        done

  lint:fmt:
    desc: "Fail when a Go file is not gofmt-formatted"
    cmds:
      - 'test -z "$(gofmt -l .)" || (echo "gofmt failures:"; gofmt -l .; exit 1)'

  lint:staticcheck:
    desc: "staticcheck on the root module (skipped with a note when it is not installed)"
    cmds:
      - if which staticcheck > /dev/null; then staticcheck ./...; else echo "staticcheck not installed; skipping"; fi

  fmt:
    desc: "Format code"
    cmds:
      - gofmt -w .

  tui:run:
    desc: "Launch the lore TUI on the current project's stores (flags after --, e.g. task lore:tui:run -- --kind task)"
    cmds:
      - CGO_ENABLED=0 go run ./cmd/lore tui {{.CLI_ARGS}}

  scenarios:
    desc: "Run all acceptance scenarios (tests/scenarios/SC-*.sh)"
    deps: [build]
    cmds:
      - task: scenarios:run

  scenarios:run:
    desc: "Body of lore:scenarios against the already built tmp/bin/lore (no rebuild; lore:check builds it once first). The scripts run in parallel, JOBS at a time (default 8; tests/lib/run-scripts.sh), slowest first"
    cmds:
      - |
        if [ ! -d {{.TESTS_DIR}}/scenarios ]; then
          echo "ERROR: {{.TESTS_DIR}}/scenarios/ not found"
          exit 1
        fi
        export LORE={{.LORE_BIN}}
        export WORKSPACE_ROOT={{.WORKSPACE_ROOT}}
        JOBS={{.JOBS | default 8}} DURATIONS_DIR="{{.ROOT_DIR}}/tmp" tests/lib/run-scripts.sh scenarios {{.TESTS_DIR}}/scenarios/SC-*.sh

  chaos:
    desc: "Run FMEA chaos scenarios (tests/chaos/CH-*.sh) — slow"
    deps: [build]
    cmds:
      - task: chaos:run

  chaos:run:
    desc: "Body of lore:chaos against the already built tmp/bin/lore (no rebuild; lore:check builds it once first). The scripts run in parallel, JOBS at a time (default 8; tests/lib/run-scripts.sh), slowest first"
    cmds:
      - |
        if [ ! -d {{.TESTS_DIR}}/chaos ]; then
          echo "ERROR: {{.TESTS_DIR}}/chaos/ not found"
          exit 1
        fi
        export LORE={{.LORE_BIN}}
        export WORKSPACE_ROOT={{.WORKSPACE_ROOT}}
        JOBS={{.JOBS | default 8}} DURATIONS_DIR="{{.ROOT_DIR}}/tmp" tests/lib/run-scripts.sh chaos {{.TESTS_DIR}}/chaos/CH-*.sh

  bench:
    desc: "Performance regression check vs Round 21 SLAs"
    deps: [build]
    cmds:
      - |
        if ! command -v hyperfine > /dev/null; then
          echo "WARN: hyperfine not installed; skipping bench"
          exit 0
        fi
        export LORE={{.LORE_BIN}}
        TMP=$(mktemp -d)
        cd $TMP && git init -q
        $LORE init --non-interactive --name=benchproj
        for i in $(seq 1 100); do $LORE memory add "memory $i tag $((i%10))"; done
        hyperfine --warmup 3 --export-json bench.json '$LORE memory search "memory" --limit=10'
        # TODO: gate via tools/bench-check
        cat bench.json | jq -r '.results[0].mean'
      - echo "bench complete"

  
  ship-check:
    desc: "Pre-v0.1 ship readiness — all gates must pass"
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: scenarios
      - task: chaos
      - task: bench
      - echo "✓ All ship-check gates PASSED"

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out bench.json
      - find . -name "*.db" -path "*/.lore/*" -delete 2>/dev/null || true

  release:
    desc: "This repo builds no release binaries: a release is a version tag made by .github/workflows/release.yml (docs/DEVELOPMENT.md \"Releases\")"
    cmds:
      - 'echo "This repo builds no release binaries: a release is the tag vX.Y.Z from .github/workflows/release.yml; the binaries are built and published separately (docs/DEVELOPMENT.md Releases)"'
      - 'exit 1'
