# lore Taskfile (v0.1)
#
# To wire into the workspace's root Taskfile.yml, add this under `includes:` (in the CUSTOM section):
#
#   lore:
#     taskfile: ./Taskfile.lore.yml
#     dir: ./
#
# Then run tasks via `task lore:<name>`.
#
# Pre-flight before commit: `task lore:ship-check`
#
# Reference: BUILD_SYSTEM.md and .ai/TASKS.md

version: "3"

vars:
  BIN_DIR: "{{.ROOT_DIR}}/tmp/bin"
  LORE_BIN: "{{.BIN_DIR}}/lore"
  WORKSPACE_ROOT: "{{.ROOT_DIR}}"
  TESTS_DIR: "{{.ROOT_DIR}}/tests"
  # File inside .git where `task check` records the tree it passed for; the
  # pre-push hook (.githooks/pre-push) reads the same name.
  CHECK_STAMP: "lore-check-passed"
  # File inside .git holding the tree when `task check` started: the stamp is
  # refused if any gate step (or a concurrent edit) changed tracked files.
  CHECK_BEGIN: "lore-check-begin"
  # Prints the tree id of the tracked files as they are in the work tree.
  TRACKED_TREE: "{{.TASKFILE_DIR}}/.githooks/lib/tracked-tree.sh"

tasks:
  build:
    desc: "Build the lore release binary from ./cmd/lore (pure-Go sqlite, CGO off, version stamped; same ldflags as .goreleaser.yml)"
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -trimpath -ldflags='-buildid= -s -w -X main.version={{.VERSION}}' -o {{.LORE_BIN}} ./cmd/lore
      - echo "Built {{.LORE_BIN}} ({{.VERSION}})"

  build:old:
    desc: "Build the old v0.1.17-layout binary from ./saas/cmd/cli into tmp/bin/lore-old (kept while saas exists: the team e2e and docs-example tasks still build it; removed in phase E)"
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -trimpath -ldflags='-buildid= -s -w -X main.version={{.VERSION}}' -o {{.BIN_DIR}}/lore-old ./saas/cmd/cli
      - echo "Built {{.BIN_DIR}}/lore-old ({{.VERSION}})"

  spec:
    desc: "Regenerate docs/reference/cli-commands.md and openapi.json from the 0.1.18 operation registry (the wire drift test fails until this is run). Runs the binary from a temp folder so it never touches this repo's hooks"
    deps: [build]
    cmds:
      - cd "$(mktemp -d)" && {{.LORE_BIN}} spec docs --out {{.ROOT_DIR}}/docs/reference && {{.LORE_BIN}} spec openapi --out {{.ROOT_DIR}}/docs/reference

  build:debug:
    desc: "Build lore (./cmd/lore) with debug symbols"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.LORE_BIN}} ./cmd/lore

  install:
    desc: "Install lore (./cmd/lore) to $GOPATH/bin"
    deps: [build]
    cmds:
      - cp {{.LORE_BIN}} $(go env GOPATH)/bin/lore
      - echo "Installed to $(go env GOPATH)/bin/lore"

  skill:install:
    desc: "Install lore Claude skill to ~/.claude/skills/lore"
    vars:
      SKILL_SRC: "{{.ROOT_DIR}}/skills"
      SKILL_DEST: "{{.HOME}}/.claude/skills/lore"
    cmds:
      - mkdir -p "{{.SKILL_DEST}}"
      - rsync -a --delete "{{.SKILL_SRC}}/" "{{.SKILL_DEST}}/"
      - echo "Installed skill to {{.SKILL_DEST}}"

  install:all:
    desc: "Build + install aicoder binary AND install Claude skill"
    cmds:
      - task: install
      - task: skill:install

  test:
    desc: "Unit + integration tests for mini's code"
    cmds:
      - go test -race ./saas/cmd/cli/... ./saas/pkg/aicoder/...
      - go test -race ./dbent/schema/...

  test:all:
    desc: "Every Go test in the workspace modules (dbent, lace, saas), incl. the CLI end-to-end suite and the docs drift test"
    cmds:
      - go test -count=1 ./dbent/... ./lace/... ./saas/...

  check:tidy:
    desc: "Fail when `go mod tidy` would change saas/go.mod or go.sum (leaves the files as they were)"
    dir: saas
    cmds:
      - |
        set -e
        keep=$(mktemp -d)
        cp go.mod go.sum "$keep"/
        go mod tidy
        if ! cmp -s go.mod "$keep/go.mod" || ! cmp -s go.sum "$keep/go.sum"; then
          cp "$keep/go.mod" "$keep/go.sum" .
          echo "✘ go mod tidy would change saas/go.mod or go.sum — run it in saas/ and commit the result"
          exit 1
        fi
        echo "✓ go mod tidy: no changes"

  check:docs:
    desc: "Docs cite code through docsync: every citation still matches (ds check). Command/flag drift is TestDocsMatchCLI in test:all"
    cmds:
      - |
        if ! command -v ds >/dev/null 2>&1; then
          echo "✘ ds (docsync) is not installed, so doc citations cannot be checked"
          exit 1
        fi
        # ds scan rewrites .ds/ledger.tsv and refs.tsv (their header records
        # the commit and time of every scan). A gate must not change tracked
        # files, so they are put back after checking; refresh them on purpose
        # with `ds scan` and commit when docs or citations change.
        keep=$(mktemp -d)
        cp .ds/ledger.tsv .ds/refs.tsv "$keep"/
        status=0
        ds scan >/dev/null && ds check || status=$?
        cp "$keep/ledger.tsv" "$keep/refs.tsv" .ds/
        rm -rf "$keep"
        exit $status

  check:begin:
    desc: "Record the tracked files' tree before the gate runs (check:stamp compares against it)"
    cmds:
      - '"{{.TRACKED_TREE}}" > "$(git rev-parse --git-path {{.CHECK_BEGIN}})"'

  check:stamp:
    desc: "Record that the gate passed for the tracked files as they are now (read by the pre-push hook); refused if they changed while it ran"
    cmds:
      - |
        set -e
        begin_file=$(git rev-parse --git-path {{.CHECK_BEGIN}})
        tree=$("{{.TRACKED_TREE}}")
        if [ -f "$begin_file" ] && [ "$(cat "$begin_file")" != "$tree" ]; then
          echo "✘ tracked files changed while the gate ran, so it did not test one version of the code:"
          git diff-tree -r --name-only "$(cat "$begin_file")" "$tree" | sed 's/^/    /'
          echo "  (a gate step must not modify tracked files; or an edit happened during the run)"
          exit 1
        fi
        echo "$tree" > "$(git rev-parse --git-path {{.CHECK_STAMP}})"
        echo "✓ gate passed for tree $tree"

  check:
    desc: "THE gate — run before every push (the pre-push hook enforces it): build, lint, race tests, every module's tests, tidy, scenarios, chaos, docs"
    cmds:
      - task: check:begin
      - task: build
      - task: lint
      - task: test
      - task: test:all
      - task: check:tidy
      - task: scenarios
      - task: chaos
      - task: check:docs
      - task: check:stamp
      - echo "✓ task check — every gate passed"

  hooks:install:
    desc: "Use the repo's committed hooks (.githooks): pre-push runs `task check` unless it already passed for the exact code being pushed"
    cmds:
      - chmod +x .githooks/*
      - git config --local core.hooksPath .githooks
      - echo "✓ hooks installed (core.hooksPath = .githooks)"

  test:sync:
    desc: "Git-sync tests only: lsync engine, merge3, canonjson, gitsetup, ids + the CLI e2e suite (real git, real binary)"
    cmds:
      - go test -race ./saas/pkg/aicoder/lsync/... ./saas/pkg/aicoder/merge3/... ./saas/pkg/aicoder/canonjson/... ./saas/pkg/aicoder/gitsetup/... ./saas/pkg/aicoder/ids/...
      - go test ./saas/cmd/cli/...

  test:team:
    desc: "Team e2e suite (LORE_TEAM_SPEC.md): real binary, real git, many actors. Not built yet = PENDING (skip); LORE_TEAM_STRICT=1 fails pending tests, LORE_TEAM_FORCE=1 skips the capability probe. Extra go test flags after --"
    cmds:
      - testlock task lore:test:team:run -- {{.CLI_ARGS}}

  test:team:run:
    desc: "Body of lore:test:team WITHOUT the machine-wide test lock; call lore:test:team instead"
    vars:
      TEAM_BIN: "{{.BIN_DIR}}/lore-team"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW (test clock).
      - CGO_ENABLED=0 go build -tags loretest -o {{.TEAM_BIN}} ./saas/cmd/cli
      # go test -json → pass / FAIL / pending matrix; exits 1 only on real failures
      # (pipefail so a build failure of the test binary is not swallowed by the pipe).
      - |
        set -o pipefail
        LORE_TEAM_BIN={{.TEAM_BIN}} go test -tags teame2e -json -run '^Test(F[0-9]|E[0-9][0-9]_|Recipe|SideEffect|Leak|Next|Worked|APIParity|LockOrderRanks$)' ./saas/cmd/cli/ {{.CLI_ARGS}} \
          | go run ./saas/cmd/cli/internal/teamharness/matrix

  trial:github:
    desc: "MANUAL ONLY, never in CI or any automatic gate: the real-repo trial (docs/team/real-repo-trial.md). Needs two empty private repos you can push to, named by LORE_TRIAL_CLIENT_REMOTE and LORE_TRIAL_STORE_REMOTE; it deletes every ref of both (only when empty or carrying the trial's marker), builds lore from this checkout and runs every team step against them, then prints a pass/fail table"
    cmds:
      - tests/team/trial/run.sh

  test:team:lockranks:
    desc: "Team e2e suite with every test under the ranked lock watch (LORE_TEAM_LOCK_RANKS=1, FORMAT_EVOLUTION 7.5/7.8; Linux only): fails when any process takes a lock ranked before one it holds. Extra go test flags after --"
    cmds:
      - LORE_TEAM_LOCK_RANKS=1 task lore:test:team -- {{.CLI_ARGS}}

  test:team:race:
    desc: "Team e2e race tests repeated (default -count=5; override: task lore:test:team:race -- -count=10)"
    cmds:
      - testlock task lore:test:team:race:run -- {{.CLI_ARGS}}

  test:team:race:run:
    desc: "Body of lore:test:team:race WITHOUT the machine-wide test lock; call lore:test:team:race instead"
    vars:
      TEAM_BIN: "{{.BIN_DIR}}/lore-team"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -tags loretest -o {{.TEAM_BIN}} ./saas/cmd/cli
      - LORE_TEAM_BIN={{.TEAM_BIN}} go test -tags teame2e -race -run 'Race' -count=5 ./saas/cmd/cli/ {{.CLI_ARGS}}

  docs:examples:
    desc: "Run every docs/team example against the real binary (tests/team/docs/run-examples.sh), then refresh the pages from the transcripts (paste.py); fails when an example misbehaves or a page is stale. One section: task lore:docs:examples -- agents"
    cmds:
      - testlock task lore:docs:examples:run -- {{.CLI_ARGS}}

  docs:examples:run:
    desc: "Body of lore:docs:examples WITHOUT the machine-wide test lock; call lore:docs:examples instead"
    vars:
      DOCS_BIN: "{{.BIN_DIR}}/lore-docs"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW, so transcripts are stable.
      - CGO_ENABLED=0 go build -tags loretest -o {{.DOCS_BIN}} ./saas/cmd/cli
      - LORE_BIN={{.DOCS_BIN}} tests/team/docs/run-examples.sh {{.CLI_ARGS}}
      - LORE_BIN={{.DOCS_BIN}} python3 tests/team/docs/paste.py

  docs:examples:core:
    desc: "Run every non-team docs example (tests/docs/run-examples.sh, one file per section in tests/docs/sections) against the real binary, then refresh docs/** (not docs/team) from the transcripts and regenerate the commands index; fails when an example misbehaves. One section: task lore:docs:examples:core -- start"
    cmds:
      - testlock task lore:docs:examples:core:run -- {{.CLI_ARGS}}

  docs:examples:core:run:
    desc: "Body of lore:docs:examples:core WITHOUT the machine-wide test lock; call lore:docs:examples:core instead"
    vars:
      DOCS_BIN: "{{.BIN_DIR}}/lore-docs"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # loretest: the build tag under which the binary honours LORE_NOW, so transcripts are stable.
      - CGO_ENABLED=0 go build -tags loretest -o {{.DOCS_BIN}} ./saas/cmd/cli
      - LORE_BIN={{.DOCS_BIN}} tests/docs/run-examples.sh {{.CLI_ARGS}}
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/paste.py
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/commands_index.py

  docs:examples:core:check:
    desc: "Fail when a non-team docs page or the generated commands index is stale against the transcripts and the real binary (no examples are re-run)"
    vars:
      DOCS_BIN: "{{.BIN_DIR}}/lore-docs"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -tags loretest -o {{.DOCS_BIN}} ./saas/cmd/cli
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/paste.py --check
      - LORE_BIN={{.DOCS_BIN}} python3 tests/docs/commands_index.py --check

  bench:sync:
    desc: "Sync performance: no-op pass, bootstrap and fresh-clone adopt at 1k/10k rows (numbers recorded in LORE_SYNC_SPEC.md)"
    cmds:
      - go test ./saas/pkg/aicoder/lsync/ -run xxx -bench . -benchtime 3x

  test:cover:
    desc: "Coverage of unit AND end-to-end tests (the e2e binary is built with -cover); lists functions no test reaches"
    cmds:
      - |
        set -e
        dir=$(mktemp -d)
        unit=$(mktemp -d)
        LORE_E2E_COVERDIR="$dir" go test -count=1 -cover -coverpkg=./saas/... ./saas/cmd/cli/... ./saas/pkg/aicoder/... -args -test.gocoverdir="$unit" >/dev/null
        go tool covdata textfmt -i="$dir,$unit" -o coverage.out
        go tool cover -func=coverage.out | tail -1
        echo "functions no test reaches (lore CLI + sync packages):"
        go tool cover -func=coverage.out | grep -E "saas/(cmd/cli|pkg/aicoder/(lsync|gitsetup|merge3|canonjson|guard|migrationlog))/" | awk '$NF == "0.0%"' || true

  build:cross:
    desc: "Cross-compile the release binary (./cmd/lore) and, while saas exists, the old one for every shipped OS/arch (platform code must build everywhere, not just on the host)"
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/lore
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./saas/cmd/cli
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/lore
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./saas/cmd/cli
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/lore
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./saas/cmd/cli
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/lore
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./saas/cmd/cli
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/lore
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./saas/cmd/cli
      - CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null ./cmd/lore
      - CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null ./saas/cmd/cli

  lint:
    desc: "Static checks: vet + fmt + staticcheck + cross-OS build"
    cmds:
      - task: build:cross
      - go vet ./saas/cmd/cli/... ./saas/pkg/aicoder/... ./dbent/schema/...
      - 'test -z "$(gofmt -l ./saas/cmd/cli/ ./saas/pkg/aicoder/ ./dbent/schema/)" || (echo "gofmt failures:"; gofmt -l ./saas/cmd/cli/ ./saas/pkg/aicoder/ ./dbent/schema/; exit 1)'
      - if which staticcheck > /dev/null; then staticcheck ./saas/cmd/cli/... ./saas/pkg/aicoder/... ./dbent/schema/...; else echo "staticcheck not installed; skipping"; fi

  fmt:
    desc: "Format code"
    cmds:
      - gofmt -w ./saas/cmd/cli/ ./saas/pkg/aicoder/ ./dbent/schema/

  schema:gen:
    desc: "Regenerate ent code from schema (after editing dbent/schema/*.go)"
    cmds:
      # dbent/cmd/entg runs the entgql extension, which reads ../apidash/gqlgen.yml
      # and writes ../apidash/internal/graph/schemas/ent.graphql. This repo has no
      # apidash module, so when it is absent a throwaway one is created for the run
      # and removed afterwards (also on failure). The gql_*.go files in dbent/gen
      # come from the extension itself, not from that config.
      - |
        made=""
        if [ ! -e apidash ]; then
          made=1
          mkdir -p apidash/internal/graph/schemas
          printf 'schema:\n  - internal/graph/schemas/*.graphqls\n' > apidash/gqlgen.yml
        fi
        # task's shell has no reliable EXIT trap: capture the status, clean, re-raise.
        rc=0
        (cd dbent && go run ./cmd/entg .) || rc=$?
        if [ -n "$made" ]; then rm -rf apidash; fi
        exit $rc

  schema:migrate:
    desc: "Apply schema to SQLite DB"
    cmds:
      - cd dbent && go run ./cmd/migrate .

  tui:gen:
    desc: "Regenerate the enttui register glue (saas/pkg/aicoder/tuigen) after a dbent schema change"
    cmds:
      # Stage on the generated ent client; tuigen imports dbent/gen/ent.
      - task: schema:gen
      - go generate ./saas/pkg/aicoder/tuigen

  tui:run:
    desc: "Launch the lore TUI on the current .lore DB (flags after --, e.g. task lore:tui:run -- --kind task)"
    cmds:
      - CGO_ENABLED=0 go run ./saas/cmd/cli tui {{.CLI_ARGS}}

  scenarios:
    desc: "Run all acceptance scenarios (tests/scenarios/SC-*.sh)"
    deps: [build]
    cmds:
      - |
        if [ ! -d {{.TESTS_DIR}}/scenarios ]; then
          echo "ERROR: {{.TESTS_DIR}}/scenarios/ not found"
          exit 1
        fi
        export LORE={{.LORE_BIN}}
        export WORKSPACE_ROOT={{.WORKSPACE_ROOT}}
        FAIL=0
        for f in {{.TESTS_DIR}}/scenarios/SC-*.sh; do
          [ -f "$f" ] || continue
          echo "▶ $(basename $f)"
          if bash "$f"; then
            echo "  ✓ PASS"
          else
            echo "  ✗ FAIL"
            FAIL=$((FAIL+1))
          fi
        done
        if [ $FAIL -gt 0 ]; then
          echo "$FAIL scenario(s) FAILED"
          exit 1
        fi
        echo "All scenarios PASSED"

  chaos:
    desc: "Run FMEA chaos scenarios (tests/chaos/CH-*.sh) — slow"
    deps: [build]
    cmds:
      - |
        if [ ! -d {{.TESTS_DIR}}/chaos ]; then
          echo "ERROR: {{.TESTS_DIR}}/chaos/ not found"
          exit 1
        fi
        export LORE={{.LORE_BIN}}
        export WORKSPACE_ROOT={{.WORKSPACE_ROOT}}
        FAIL=0
        for f in {{.TESTS_DIR}}/chaos/CH-*.sh; do
          [ -f "$f" ] || continue
          echo "▶ $(basename $f)"
          if bash "$f"; then
            echo "  ✓ PASS"
          else
            echo "  ✗ FAIL"
            FAIL=$((FAIL+1))
          fi
        done
        if [ $FAIL -gt 0 ]; then
          echo "$FAIL chaos scenario(s) FAILED"
          exit 1
        fi
        echo "All chaos scenarios PASSED"

  bench:
    desc: "Performance regression check vs Round 21 SLAs"
    deps: [build]
    cmds:
      - |
        if ! command -v hyperfine > /dev/null; then
          echo "WARN: hyperfine not installed; skipping bench"
          exit 0
        fi
        export LORE={{.LORE_BIN}}
        TMP=$(mktemp -d)
        cd $TMP && git init -q
        $LORE init --non-interactive --name=benchproj
        for i in $(seq 1 100); do $LORE memory add "memory $i tag $((i%10))"; done
        hyperfine --warmup 3 --export-json bench.json '$LORE memory search "memory" --limit=10'
        # TODO: gate via tools/bench-check
        cat bench.json | jq -r '.results[0].mean'
      - echo "bench complete"

  
  ship-check:
    desc: "Pre-v0.1 ship readiness — all gates must pass"
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: scenarios
      - task: chaos
      - task: bench
      - echo "✓ All ship-check gates PASSED"

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out bench.json
      - find . -name "*.db" -path "*/.lore/*" -delete 2>/dev/null || true

  release:
    desc: "Build release artifacts (TODO: integrate with goreleaser per ship-gate)"
    cmds:
      - 'echo "TODO: integrate with goreleaser per ship-gate"'
      - 'exit 1'
